  // ====================================================================
  // Firebase 설정 — Firebase 콘솔의 프로젝트 설정에서 복사해 여기에 붙여넣으세요.
  // (프로젝트 설정 > 일반 > 내 앱 > SDK 설정 및 구성 > 구성)
  // ====================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyA1_AZcZQnh3UpdP3WJxOzc5YUC8XtUVkc",
    authDomain: "raid-dda42.firebaseapp.com",
    projectId: "raid-dda42",
    storageBucket: "raid-dda42.firebasestorage.app",
    messagingSenderId: "775623601647",
    appId: "1:775623601647:web:c23f8fdfa9685758035a1a"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const COLLECTION = "raid_storage";

  // Claude 아티팩트의 window.storage API와 동일한 모양으로 만든 Firestore 어댑터.
  // 덕분에 아래 앱 코드는 거의 손대지 않고 그대로 재사용할 수 있습니다.
  window.storage = {
    get: async (key) => {
      const doc = await db.collection(COLLECTION).doc(key).get();
      if (!doc.exists) {
        const err = new Error("not found: " + key);
        err.notFound = true;
        throw err;
      }
      return { key, value: doc.data().value, shared: true };
    },
    set: async (key, value) => {
      await db.collection(COLLECTION).doc(key).set({ value });
      return { key, value, shared: true };
    },
    list: async (prefix) => {
      const snap = await db.collection(COLLECTION).get();
      const keys = [];
      snap.forEach((d) => {
        if (!prefix || d.id.startsWith(prefix)) keys.push(d.id);
      });
      return { keys, prefix, shared: true };
    },
    delete: async (key) => {
      await db.collection(COLLECTION).doc(key).delete();
      return { key, deleted: true, shared: true };
    },
  };
</script>

const ASSET_V = Date.now();
function withV(path) {
  return `${path}?v=${ASSET_V}`;
}

// "레이드 하루"는 자정이 아니라 아침 6시에 넘어간다.
// 예: 수요일 새벽 3시는 아직 "화요일"로 취급한다.
function raidDate(d) {
  const base = d ? new Date(d) : new Date();
  return new Date(base.getTime() - 6 * 60 * 60 * 1000);
}

function todayLabel() {
  const jsDay = raidDate().getDay(); // 0=일 1=월 ... 6=토
  return DAYS[(jsDay + 6) % 7];
}

function currentGuardianName(now) {
  const diffWeeks = Math.floor((now.getTime() - GUARDIAN_ANCHOR_TIME) / (7 * 24 * 60 * 60 * 1000));
  let idx = (GUARDIAN_ANCHOR_INDEX + diffWeeks) % GUARDIAN_ROTATION.length;

// 로스트아크 경매 입찰가/손익 계산 (수수료 5% 고정, 인원수 기반)
function computeAuctionRows(price, n) {
  if (!price || !n || n < 2) return [];
  const direct = (price * (n - 1)) / n;
  const bep = direct * 0.95;
  const marginRows = [0, 25, 50, 75, 100].map((L) => {
    const bid = bep / (1 + L / 1000);
    const profit = bid * (L / 1000);
    return { label: L === 0 ? "손익 분기점" : L === 100 ? "선점" : `${L}%`, bid, profit };
  });
  return [{ label: "직접 사용", bid: direct, profit: price - direct }, ...marginRows].map((r) => ({
    ...r,
    bid: Math.round(r.bid),
    profit: Math.round(r.profit),
  }));
}

// 캘린더 데이터에서 특정 키워드(카오스게이트/필드보스 등) 콘텐츠가 오늘 일정에 있는지 확인
// "오늘"의 기준은 아침 6시(레이드 하루 기준)이다.
function hasTodayContent(calendarData, keyword) {
  if (!Array.isArray(calendarData)) return false;
  const todayStr = raidDate().toDateString();
  return calendarData.some((item) => {
    const label = `${item.CategoryName || ""} ${item.ContentsName || ""}`;
    if (!label.includes(keyword)) return false;
    const times = Array.isArray(item.StartTimes) ? item.StartTimes : [];
    return times.some((t) => {
      const d = new Date(t);
      return !isNaN(d) && raidDate(d).toDateString() === todayStr;
    });
  });
}

function toMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

// returns [start, end] in minutes; if end <= start, treat the range as crossing midnight
function toRange(start, end) {
  const s = toMinutes(start);
  let e = toMinutes(end);
  if (e <= s) e += 24 * 60;
  return [s, e];
}

function dayIntervals(members, day) {
  const intervals = [];
  members.forEach((m) => {
    const s = m.schedule && m.schedule[day];
    if (s && s.enabled && s.start !== s.end) {
      const [start, end] = toRange(s.start, s.end);
      intervals.push({ id: m.id, start, end });
    }
  });
  return intervals;
}

function segmentsFromIntervals(intervals) {
  if (intervals.length === 0) return [];
  const points = Array.from(new Set(intervals.flatMap((iv) => [iv.start, iv.end]))).sort((a, b) => a - b);
  const segments = [];
  for (let i = 0; i < points.length - 1; i++) {
    const t = points[i];
    const active = intervals.filter((iv) => iv.start <= t && iv.end > t).map((iv) => iv.id);
    if (active.length >= 1) segments.push({ start: t, end: points[i + 1], ids: active });
  }
  const blocks = [];
  segments.forEach((seg) => {
    const prev = blocks[blocks.length - 1];
    const sameSet = prev && prev.end === seg.start && prev.ids.length === seg.ids.length && prev.ids.every((id) => seg.ids.includes(id));
    if (sameSet) {
      prev.end = seg.end;
    } else {
      blocks.push({ ...seg });
    }
  });
  return blocks.sort((a, b) => a.start - b.start);
}

function daySegments(members, day) {
  return segmentsFromIntervals(dayIntervals(members, day));
}

// "오늘의 시간표" 전용: 다음 요일 항목 중 00:00~06:00 사이에 시작하는 부분은
// (레이드 하루가 아침 6시에 넘어가는 것과 같은 기준으로) 오늘 밤에서 이어지는 일정으로 보고 같이 끌어온다.
// 06:00 이후로 넘어가는 부분은 진짜 다음 날 몫이라 잘라낸다. 요일별 편집 화면·주간 전체보기에는 적용하지 않는다.
function todaySegmentsWithCarryover(members, day) {
  const base = dayIntervals(members, day);
  const nextDay = DAYS[(DAYS.indexOf(day) + 1) % 7];
  const carried = dayIntervals(members, nextDay)
    .filter((iv) => iv.start < 6 * 60)
    .map((iv) => ({ id: iv.id, start: iv.start + 24 * 60, end: Math.min(iv.end, 6 * 60) + 24 * 60 }));
  return segmentsFromIntervals([...base, ...carried]);
}

function fmt(mins) {
  const wrapped = ((mins % 1440) + 1440) % 1440;
  const h = String(Math.floor(wrapped / 60)).padStart(2, "0");
  const m = String(wrapped % 60).padStart(2, "0");
  return `${h}:${m}`;
}

function pad2(n) {
  return String(n).padStart(2, "0");
}

function splitTime(t) {
  const [h, m] = (t || "0:00").split(":").map(Number);
  return { h: h || 0, m: m || 0 };
}

function dayHoursLabel(s) {
  if (!s || !s.enabled || s.start === s.end) return null;
  const [start, end] = toRange(s.start, s.end);
  const totalMin = end - start;
  const hrs = totalMin / 60;
  const label = Number.isInteger(hrs) ? `${hrs}시간` : `${hrs.toFixed(1)}시간`;
  return label;
}

function timeAgo(ts) {
  if (!ts) return "";
  const diffMin = Math.floor((Date.now() - ts) / 60000);
  if (diffMin < 1) return "방금";
  if (diffMin < 60) return `${diffMin}분 전`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `${diffHr}시간 전`;
  return `${Math.floor(diffHr / 24)}일 전`;
}

function gradeFromBraceletText(text, context) {
  if (!text) return null;
  const ctx = context || text;
  for (const entry of BRACELET_GRADE_TABLE) {
    if (!entry.requires.every((k) => ctx.includes(k))) continue;
    let num = null;
    if (entry.unit === "%") {
      // 한 문장에 다른 %가 섞여 있을 수 있어 마지막 % 매치를 사용한다.
      const matches = [...text.matchAll(/(\d+(?:\.\d+)?)\s*%/g)];
      if (matches.length === 0) continue;
      num = parseFloat(matches[matches.length - 1][1].replace(/,/g, ""));
    } else {
      // "30초마다", "(최대 N중첩)" 등 다른 숫자가 섞일 수 있어, "증가/감소" 동사 바로 앞 숫자만 집는다.
      const m = text.match(/(\d{1,2},\d{3}|\d{3,6})\s*(?:이|가|씩)?\s*(?:증가|감소)/);
      if (!m) continue;
      num = parseFloat(m[1].replace(/,/g, ""));
    }
    const idx = entry.tiers.findIndex((v) => Math.abs(v - num) < 0.01);
    if (idx !== -1) return GRADE_LABELS[idx];
  }
  return null;
}

// 팔찌의 고정 스탯(힘/민첩/지능, 제압/특화/신속/치명/인내/숙련) 값 구간별 색상.
function statLineColor(name, valueStr) {
  const num = parseFloat((valueStr || "").replace(/[+,]/g, ""));
  if (Number.isNaN(num)) return null;
  if (["힘", "민첩", "지능"].includes(name)) {
    if (num >= 16000) return "#f5d949";
    if (num >= 14000) return "#b78cf5";
    if (num >= 12000) return "#5ec9e8";
    return "#7fbf5f";
  }
  if (["치명", "특화", "신속", "제압", "인내", "숙련"].includes(name)) {
    if (num >= 120) return "#f5d949";
    if (num >= 101) return "#b78cf5";
    if (num >= 85) return "#5ec9e8";
    return "#7fbf5f";
  }
  return null;
}

function gradeFromValue(name, valueStr) {
  if (!name || !valueStr) return null;
  const unit = valueStr.includes("%") ? "%" : "+";
  const num = parseFloat(valueStr.replace(/[+%,]/g, ""));
  if (Number.isNaN(num)) return null;
  const entry = GRADE_TABLE.find((t) => name.includes(t.match) && t.unit === unit);
  if (!entry) return null;
  const idx = entry.tiers.findIndex((v) => Math.abs(v - num) < 0.01);
  return idx === -1 ? null : GRADE_LABELS[idx];
}

function extractTooltipOptionLines(tooltipRaw) {
  const empty = { lines: [], items: [], raw: "" };
  if (!tooltipRaw) return empty;
  let obj;
  try {
    obj = JSON.parse(tooltipRaw);
  } catch (e) {
    return empty;
  }
  const rawLines = [];
  function walk(node) {
    if (node == null) return;
    if (typeof node === "string") {
      const stripped = node
        .replace(/<br\s*\/?>/gi, "\n")
        .replace(/<[^>]*>/g, "\n")
        .replace(/&nbsp;/g, " ");
      stripped
        .split("\n")
        .map((s) => s.trim())
        .filter(Boolean)
        .forEach((s) => rawLines.push(s));
    } else if (Array.isArray(node)) {
      node.forEach(walk);
    } else if (typeof node === "object") {
      Object.values(node).forEach(walk);
    }
  }
  walk(obj);

  const STOP_MARKERS = ["ItemPartBox", "MultiTextBox", "SingleTextBox", "Progress", "NameTagBox", "ItemTitle"];
  const STAT_ONLY = /^(체력|힘|민첩|지능)\s*[+\-]?[\d,.]+$/;

  function sectionChunk(marker) {
    const idx = rawLines.indexOf(marker);
    if (idx === -1) return null;
    const chunk = [];
    for (let i = idx + 1; i < rawLines.length; i++) {
      const l = rawLines[i];
      if (STOP_MARKERS.includes(l)) break;
      if (l === "IndentStringGroup") continue; // 하위 구조 표지, 건너뛰고 계속
      chunk.push(l);
    }
    return chunk;
  }

  const lines = [];
  const items = [];

  // [1] 목걸이/귀걸이/반지: "연마 효과" 구간에 [이름, 값, 이름, 값 ...] 순서로 나온다.
  let chunk = sectionChunk("연마 효과");
  if (chunk) {
    for (let i = 0; i < chunk.length; i += 2) {
      const name = chunk[i];
      const val = chunk[i + 1] || "";
      if (name) {
        lines.push(val ? `${name} ${val}` : name);
        items.push({ name, value: val });
      }
    }
  }

  // [2] 어빌리티 스톤: "세공 단계 보너스" 구간에 [ 이름 | Lv.N | ] 형태로 대괄호가 섞여 나온다.
  if (lines.length === 0) {
    chunk = sectionChunk("세공 단계 보너스");
    if (chunk) {
      const cleaned = chunk.filter((l) => l !== "[" && l !== "]" && l !== "레벨 보너스" && !STAT_ONLY.test(l));
      for (let i = 0; i < cleaned.length; i++) {
        const cur = cleaned[i];
        if (/^Lv\.?\s*\d+$/i.test(cur)) continue;
        const next = cleaned[i + 1];
        if (next && /^Lv\.?\s*\d+$/i.test(next)) {
          lines.push(`${cur} ${next}`);
          items.push({ name: cur, value: next });
          i++;
        } else if (/[%\d]/.test(cur) && cur !== "무작위 각인 효과") {
          lines.push(cur);
          items.push({ name: cur, value: "" });
        }
      }
    }
  }

  // [3] 팔찌: "팔찌 효과" 구간. 힘/민첩/지능, 치명/특화/신속 같은 고정 스탯 줄은 별도로 추출하고,
  // 나머지는 옵션 하나가 한 줄로 오는 경우도, "이름 문구 | N% | 증가한다."처럼
  // 퍼센트 값이 앞뒤 문구와 분리된 3줄로 오는 경우도 있어 앞뒤를 붙여서 완전한 문장으로 만든다.
  // [3] 팔찌: "팔찌 효과" 구간. 힘/민첩/지능, 치명/특화/신속 같은 고정 스탯 줄은
  // 툴팁 전체(rawLines)에서 별도로 찾고, 나머지는 옵션 하나가 한 줄로 오는 경우도, "이름 문구 | N% | 증가한다."처럼
  // 퍼센트 값이 앞뒤 문구와 분리된 3줄로 오는 경우도 있어 앞뒤를 붙여서 완전한 문장으로 만든다.
  // [3] 팔찌: "팔찌 효과" 구간. 힘/민첩/지능, 제압/특화/신속/치명/인내/숙련 같은 고정 스탯 줄은
  // 툴팁 전체(rawLines)에서 별도로 찾고, 나머지 옵션은 "%"가 있는 줄뿐 아니라 "N 증가한다"처럼
  // %없이 순수 수치로만 오는 줄(예: 무기 공격력)도 포함해서, 앞뒤 문구와 분리된 경우 이어 붙여 완전한 문장으로 만든다.
  if (lines.length === 0) {
    const STAT_NAMES = ["힘", "민첩", "지능", "특화", "치명", "신속", "제압", "인내", "숙련"];
    const STAT_LINE_COMBINED = /^(힘|민첩|지능|특화|치명|신속|제압|인내|숙련)\s*[+\-]?([\d,]+)$/;
    const NUM_ONLY = /^[+\-]?[\d,]+$/;
    const FLAT_EFFECT = /\d[\d,]*\s*(증가|감소)/; // "N 증가한다"류: %없이 숫자+증가/감소가 한 줄에 붙어오는 경우
    // "이름 +N%"처럼 그 자체로 이미 완결된 한 줄(뒤에 다른 옵션 문구를 잘못 이어붙이지 않기 위해 구분)
    const SELF_CONTAINED_PAIR = /^[가-힣()·\s]+[+]?[\d,]+(?:\.\d+)?%$/;

    function extractStatLines(arr) {
      const found = [];
      const seen = new Set();
      for (let idx = 0; idx < arr.length; idx++) {
        const l = arr[idx];
        const cm = l.match(STAT_LINE_COMBINED);
        if (cm && !seen.has(cm[1])) {
          found.push({ name: cm[1], value: `+${cm[2].replace(/,/g, "")}`, statLine: true, idx });
          seen.add(cm[1]);
          continue;
        }
        if (STAT_NAMES.includes(l) && !seen.has(l) && arr[idx + 1] && NUM_ONLY.test(arr[idx + 1])) {
          const raw = arr[idx + 1].replace(/,/g, "");
          const val = raw.startsWith("+") || raw.startsWith("-") ? raw : `+${raw}`;
          found.push({ name: l, value: val, statLine: true, idx, idx2: idx + 1 });
          seen.add(l);
        }
      }
      return found;
    }

    chunk = sectionChunk("팔찌 효과");
    let statLines = [];
    const consumedIdx = new Set();
    if (chunk) {
      statLines = extractStatLines(chunk);
      statLines.forEach((s) => {
        consumedIdx.add(s.idx);
        if (s.idx2 != null) consumedIdx.add(s.idx2);
      });
    }
    // "팔찌 효과" 구간 안에서 못 찾았으면 툴팁 전체에서 한 번 더 찾아본다 (안전망).
    if (statLines.length === 0) {
      statLines = extractStatLines(rawLines);
    }

    if (chunk || statLines.length > 0) {
      statLines.forEach((it) => {
        lines.push(`${it.name} ${it.value}`);
        items.push({ name: it.name, value: it.value, statLine: true });
      });
      const filtered = (chunk || []).filter((l, idx) => !consumedIdx.has(idx) && !STAT_ONLY.test(l));
      const used = new Set();
      for (let i = 0; i < filtered.length; i++) {
        if (used.has(i)) continue;
        const l = filtered[i];
        const isCore = l.includes("%") || FLAT_EFFECT.test(l) || NUM_ONLY.test(l);
        if (!isCore) continue;
        const selfContained = SELF_CONTAINED_PAIR.test(l);
        let prefix = "";
        let suffix = "";
        if (!selfContained) {
          if (
            i > 0 &&
            !used.has(i - 1) &&
            !filtered[i - 1].includes("%") &&
            !FLAT_EFFECT.test(filtered[i - 1]) &&
            !/^[+\-]?[\d,.]+$/.test(filtered[i - 1])
          ) {
            prefix = filtered[i - 1];
            used.add(i - 1);
          }
          if (
            i + 1 < filtered.length &&
            !used.has(i + 1) &&
            !filtered[i + 1].includes("%") &&
            /증가|감소/.test(filtered[i + 1]) &&
            !FLAT_EFFECT.test(filtered[i + 1]) &&
            !/^[+\-]?[\d,.]+$/.test(filtered[i + 1])
          ) {
            suffix = filtered[i + 1];
            used.add(i + 1);
          }
        }
        used.add(i);
        const combined = [prefix, l, suffix]
          .filter(Boolean)
          .join(" ")
          .replace(/\.$/, "")
          .trim();
        const finalText = combined.length > 60 ? combined.slice(0, 60) + "…" : combined;
        lines.push(finalText);
        items.push({ name: finalText, value: "" });
      }
    }
  }

  return { lines: lines.slice(0, 10), items: items.slice(0, 10), raw: rawLines.join(" | ") };
}

// 주간 시간설정 리셋 시간: 매주 화요일 20:00
// 가장 최근에 지나간 "화요일 20:00"(요일별 게임 가능 시간 초기화 시점)을 구한다 (0=일 ... 2=화)
function lastScheduleReset(now) {
  const d = new Date(now);
  const day = d.getDay();
  const diff = (day - 2 + 7) % 7;
  d.setDate(d.getDate() - diff);
  d.setHours(20, 0, 0, 0);
  if (d.getTime() > now.getTime()) {
    d.setDate(d.getDate() - 7);
  }
  return d;
}

  async function logAccess(entry) {
    try {
      const r = await window.storage.get("meta:accessLog", true).catch(() => null);
      const current = r && r.value ? JSON.parse(r.value) : { log: [] };
      const log = Array.isArray(current.log) ? current.log : [];

    } catch (e) {}
  }

  // 같은 세션에서 앞서 익명/추정으로 남았던 접속 기록을, 실제 로그인이 확인된 시점에
  // 새 기록으로 "대체"한다 (같은 세션의 항목을 뒤에서부터 찾아 덮어쓰고, 없으면 새로 추가).
  async function upgradeAccessEntry(entry) {
    try {
      const r = await window.storage.get("meta:accessLog", true).catch(() => null);
      const current = r && r.value ? JSON.parse(r.value) : { log: [] };
      const log = Array.isArray(current.log) ? current.log : [];
      let idx = -1;
      for (let i = log.length - 1; i >= 0; i--) {
        if (log[i] && log[i].sessionId === entry.sessionId) {
          idx = i;
          break;
        }
      }
      const updated = idx === -1 ? [...log, entry] : [...log.slice(0, idx), entry, ...log.slice(idx + 1)];
      await window.storage.set("meta:accessLog", JSON.stringify({ log: updated.slice(-200) }), true);
    } catch (e) {}
  }

  async function deleteAccessLogEntry(entry) {

    setAccessLogEntries((prev) => prev.filter((e) => !matches(e)));

      const current = r && r.value ? JSON.parse(r.value) : { log: [] };
      const log = Array.isArray(current.log) ? current.log : [];
      const updated = log.filter((e) => !matches(e));
      await window.storage.set("meta:accessLog", JSON.stringify({ log: updated }), true);
    } catch (e) {}
  }

  useEffect(() => {
    async function poll() {
      try {
        const listed = await window.storage.list("presence:", true);
        const keys = listed && listed.keys ? listed.keys : [];
        const fetched = await Promise.all(
          keys.map(async (k) => {
            try {
              const r = await window.storage.get(k, true);
              return r && r.value ? JSON.parse(r.value) : null;
            } catch (e) {
              return null;
            }
          })
        );
        const now = Date.now();
        const active = fetched.filter((p) => p && now - p.lastSeen < 60000);
        // 로그인 이름이 같거나, 로그인 안 했어도 "마지막으로 로그인했던 이름"이 같으면
        // PC/모바일 등 세션이 여러 개여도 같은 사람으로 보고 1명으로 센다.
        const identityKeys = new Set(
          active.map((p, i) => (p.name ? "n:" + p.name : p.remembered ? "r:" + p.remembered : "s:" + i))
        );
        setOnlineCount(identityKeys.size);
        setOnlineNames(Array.from(new Set(active.map((p) => p.name).filter(Boolean))));
        setOnlineGuesses(
          Array.from(

            )
          )
        );
        setOnlineUnknownCount(active.filter((p) => !p.name && !p.remembered).length);
      } catch (e) {}
    }
    poll();
    const t = setInterval(poll, 15000);
    return () => clearInterval(t);
  }, []);

      await window.storage.delete("member:" + id, true);
    } catch (e) {
      setError("삭제에 실패했습니다.");
      return;
    }
    setMembers((prev) => prev.filter((m) => m.id !== id));
    setConfirmDelete(false);
    logout();
  }

  function openSlotEditor(idx) {
    const existing = loggedIn.characters[idx];
    setSlotDraft(existing ? { ...existing } : { name: "", className: "", role: "딜러", level: "" });
    setEditSlot(idx);
  }

  async function saveSlot() {
    if (!slotDraft.name.trim()) return;
    const chars = [...loggedIn.characters];
    while (chars.length <= editSlot) chars.push(null);
    chars[editSlot] = {
      id: chars[editSlot] && chars[editSlot].id ? chars[editSlot].id : uid(),
      name: slotDraft.name.trim(),
      className: slotDraft.className.trim(),
      role: slotDraft.role,
      level: Number(slotDraft.level) || 0,
      raidDone: chars[editSlot] ? !!chars[editSlot].raidDone : false,
    };
    await saveMember({ ...loggedIn, characters: chars });
    setEditSlot(null);
  }

  async function toggleRaidDone(idx, done) {
    const chars = [...loggedIn.characters];
    if (!chars[idx]) return;
    chars[idx] = { ...chars[idx], raidDone: done };
    await saveMember({ ...loggedIn, characters: chars });
  }

  async function importFromLostArk() {
    if (!loggedIn || !loggedIn.characters[0]) return;
    const repName = loggedIn.characters[0].name;
    setImportLoading(true);
    setImportError("");
    try {
      const res = await fetch(LOSTARK_PROXY_URL + "?name=" + encodeURIComponent(repName));
      if (!res.ok) throw new Error("API 오류 (" + res.status + ")");
      const list = await res.json();
      if (!Array.isArray(list) || list.length === 0) {
        throw new Error("캐릭터를 찾을 수 없습니다: " + repName);
      }
      const parsed = list
        .map((c) => ({
          name: c.CharacterName,
          className: c.CharacterClassName,
          level: parseFloat(String(c.ItemAvgLevel).replace(/,/g, "")) || 0,
        }))
        .sort((a, b) => b.level - a.level)
        .slice(0, MAX_SLOTS);

      const withPower = await Promise.all(
        parsed.map(async (c) => {
          try {
            const pr = await fetch(LOSTARK_PROXY_URL + "?type=profile&name=" + encodeURIComponent(c.name));
            if (!pr.ok) return { ...c, combatPower: null };
            const profile = await pr.json();
            const cp = profile && profile.CombatPower ? parseFloat(String(profile.CombatPower).replace(/,/g, "")) : null;
            return { ...c, combatPower: cp };
          } catch (e) {
            return { ...c, combatPower: null };
          }
        })
      );

      const oldByName = {};
      loggedIn.characters.forEach((c) => {
        if (c) oldByName[c.name] = c;
      });

      const newChars = withPower.map((c) => ({
        id: oldByName[c.name] ? oldByName[c.name].id : uid(),
        name: c.name,
        className: c.className,
        role: roleOf(c.className),
        level: c.level,
        combatPower: c.combatPower,
        raidDone: oldByName[c.name] ? !!oldByName[c.name].raidDone : false,
      }));

      await saveMember({ ...loggedIn, characters: newChars });
    } catch (e) {
      setImportError(e.message || "불러오기에 실패했습니다.");
    } finally {
      setImportLoading(false);
    }
  }

  async function safeFetchJson(type, name, retries = 1) {
    for (let attempt = 0; attempt <= retries; attempt++) {
      try {
        const res = await fetch(LOSTARK_PROXY_URL + "?type=" + type + "&name=" + encodeURIComponent(name));
        if (!res.ok) {
          if (attempt < retries) {
            await new Promise((r) => setTimeout(r, 400));
            continue;
          }
          return null;
        }
        const text = await res.text();
        try {
          return JSON.parse(text);
        } catch (e) {
          return null;
        }
      } catch (e) {
        if (attempt < retries) {
          await new Promise((r) => setTimeout(r, 400));
          continue;
        }
        return null;
      }
    }
    return null;
  }

  // 대표 캐릭터 이름 하나로 원정대 전체(레벨/전투력/특성 포함)를 불러온다.
  // 캐릭터가 많을 때 한꺼번에 다 쏘면(예: 30명 × 2요청) API가 순간적으로 밀려서 실패할 수 있어
  // 5명씩 나눠서 순차적으로 불러온다. 맨 처음 siblings 요청이 실패하면 통째로 빈 결과가 되므로
  // 여기만 재시도를 3번(지수 백오프)까지 늘려서 좀 더 끈질기게 시도한다.
  async function fetchRosterChars(repName) {
    let list = null;
    for (let attempt = 0; attempt < 4; attempt++) {
      list = await safeFetchJson("siblings", repName, 0);
      if (Array.isArray(list) && list.length > 0) break;
      if (attempt < 3) await new Promise((r) => setTimeout(r, 500 * (attempt + 1)));
    }
    if (!Array.isArray(list) || list.length === 0) return [];
    const sorted = [...list].sort(
      (a, b) =>
        (parseFloat(String(b.ItemAvgLevel || "0").replace(/,/g, "")) || 0) -
        (parseFloat(String(a.ItemAvgLevel || "0").replace(/,/g, "")) || 0)
    );
    const results = [];
    const BATCH = 5;
    for (let i = 0; i < sorted.length; i += BATCH) {
      const batch = sorted.slice(i, i + BATCH);
      const batchResults = await Promise.all(
        batch.map(async (c) => {
          const name = c.CharacterName;
          const level = parseFloat(String(c.ItemAvgLevel || "0").replace(/,/g, "")) || 0;
          const className = c.CharacterClassName;
          try {
            const [profile, arkpassive] = await Promise.all([
              safeFetchJson("profile", name),
              safeFetchJson("arkpassive", name),
            ]);
            const combatPower =
              profile && profile.CombatPower ? parseFloat(String(profile.CombatPower).replace(/,/g, "")) : null;
            return { name, className, level, combatPower, spec: extractSpecName(arkpassive) };
          } catch (e) {
            return { name, className, level, combatPower: null, spec: null };
          }
        })
      );
      results.push(...batchResults);
    }
    return results;
  }

  // "정보" 버튼: 등록된 6슬롯이 아니라 실제 로스트아크 원정대 전체 캐릭터를 불러와 보여준다.
  async function openRosterView(m) {
    setRosterView(m);
    setRosterChars([]);
    setRosterLoading(true);
    const repChar = (m.characters || []).find(Boolean);
    if (!repChar) {
      setRosterLoading(false);
      return;
    }
    try {
      setRosterChars(await fetchRosterChars(repChar.name));
    } catch (e) {
      // 조용히 실패 — 목록이 비어있는 채로 남는다.
    } finally {
      setRosterLoading(false);
    }
  }

  // 캐릭터 상세보기에서 "원정대로 돌아가기": 지금 보고 있는 캐릭터를 대표로 삼아 원정대 요약을 다시 연다.
  async function backToRosterFromDetail() {
    const repName = detailFor;
    closeDetail();
    setRosterView({ id: repName, characters: [{ name: repName }] });
    setRosterChars([]);
    setRosterLoading(true);
    try {
      setRosterChars(await fetchRosterChars(repName));
    } catch (e) {
      // 조용히 실패
    } finally {
      setRosterLoading(false);
    }
  }

  async function openDetail(name, memberChars) {
    setDetailFor(name);
    setDetailMemberChars(memberChars || null);
    setDetailData(null);
    setDetailError("");
    setDetailLoading(true);

    // 사이트에 등록된 캐릭터 슬롯(최대 6개)이 아니라, 실제 로스트아크 원정대 전체 캐릭터 목록을 항상 불러온다.
    safeFetchJson("siblings", name).then((list) => {
      if (Array.isArray(list) && list.length > 0) {
        const sorted = [...list].sort(
          (a, b) => (parseFloat(String(b.ItemAvgLevel || "0").replace(/,/g, "")) || 0) -
            (parseFloat(String(a.ItemAvgLevel || "0").replace(/,/g, "")) || 0)
        );
        setDetailMemberChars(sorted.map((c) => ({ id: c.CharacterName, name: c.CharacterName })));
      }
    });

    try {
      const [profile, equipment, engravings, gems, arkpassive, arkgrid] = await Promise.all([
        safeFetchJson("profile", name),
        safeFetchJson("equipment", name),
        safeFetchJson("engravings", name),
        safeFetchJson("gems", name),
        safeFetchJson("arkpassive", name),
        safeFetchJson("arkgrid", name),
      ]);
      if (!profile) throw new Error("캐릭터 정보를 찾을 수 없습니다.");
      setDetailData({ profile, equipment, engravings, gems, arkpassive, arkgrid });
    } catch (e) {
      setDetailError(e.message || "불러오기에 실패했습니다.");
    } finally {
      setDetailLoading(false);
    }
  }

  const detailEquipList = useMemo(() => {

  }, [detailData]);

  function gemLevelOf(g) {
    if (typeof g.Level === "number") return g.Level;
    const m = String(g.Name || "").match(/(\d+)\s*레벨/);
    return m ? parseInt(m[1], 10) : 0;
  }

  // 10레벨 멸화는 시인성(색상/집계) 상 8레벨과 동일하게 취급한다.
  function gemEffectiveLevel(g) {
    const lvl = gemLevelOf(g);
    if (lvl === 10 && String(g.Name || "").includes("멸화")) return 8;
    return lvl;
  }

  // 아크 패시브 응답의 최상위 Title 필드가 바로 직업각인(특성 빌드) 이름이다.
  // 예: {"Title":"완벽한 억제", ...} → "완벽한 억제"
  // Effects[].Name 은 "진화/깨달음/도약" 트리 분류명이 반복될 뿐이라 사용하지 않는다.
  function extractSpecName(arkpassive) {
    if (!arkpassive) return null;
    if (typeof arkpassive.Title === "string" && arkpassive.Title.trim()) {
      return arkpassive.Title.trim();
    }
    return null;
  }

  function stripHtml(s) {
    if (typeof s !== "string") return "";
    return s.replace(/<br\s*\/?>/gi, " / ").replace(/<[^>]+>/g, "").trim();
  }

  // 각인 레벨별 시인성 색상: 4는 금색, 3은 보라, 2는 파랑, 1 이하/미상은 흰색.
  function engravingLevelColor(lvl) {
    const n = Number(lvl);
    if (n >= 4) return "#ffd200";
    if (n === 3) return "#c48cf0";
    if (n === 2) return "#4fa8e0";
    return "#ffffff";
  }

  // 아크그리드 등급별 색상 (로스트아크 아이템 등급 색과 동일): 고대=베이지, 유물=주황, 전설=금색.
  function gradeColor(grade) {
    if (grade === "고대") return "#E3C7A1";
    if (grade === "유물") return "#FA5D00";
    if (grade === "전설") return "#F99200";
    return "#8b93a7";
  }

  // 아크그리드 정보 사전 텍스트 안의 "24.0%(전설·유물)" 같은 수치+등급 표기에 등급 색을 입힌다.
  // 앞의 숫자에도 같이 색을 입혀서 어떤 등급에 해당하는 값인지 바로 보이게 한다.
  // 전설·유물은 값이 항상 동일하므로 유물 색으로 통일한다.
  function renderGradedText(text) {
    const re = /(\d+(?:\.\d+)?%?)(\(((?:전설|유물|고대)(?:·(?:전설|유물|고대))*)\))/g;
    const parts = [];
    let last = 0;
    let m;
    let i = 0;
    while ((m = re.exec(text))) {
      if (m.index > last) parts.push(text.slice(last, m.index));
      const grades = m[3].split("·");
      const numColor = grades.includes("유물") ? gradeColor("유물") : gradeColor(grades[0]);
      parts.push(
        <span key={i++} style={{ color: numColor, fontWeight: 700 }}>
          {m[1]}
        </span>
      );
      parts.push(
        <span key={i++}>
          (
          {grades.map((g, gi) => (
            <React.Fragment key={gi}>
              {gi > 0 && "·"}
              <span style={{ color: gradeColor(g), fontWeight: 700 }}>{g}</span>
            </React.Fragment>
          ))}
          )
        </span>
      );
      last = re.lastIndex;
    }
    if (last < text.length) parts.push(text.slice(last));
    return parts;
  }

  // 아크그리드 코어/젬의 Tooltip 필드는 JSON 문자열이라 한 번 더 파싱이 필요하다.
  function parseTooltipJson(t) {
    if (typeof t !== "string") return null;
    try {
      return JSON.parse(t);
    } catch (e) {
      return null;
    }
  }
  // NameTagBox처럼 value가 바로 문자열인 경우도 있고,
  // ItemPartBox처럼 value가 { Element_000: 라벨, Element_001: 실제 값 } 형태로 중첩된 경우도 있다.
  function tooltipText(tt, key) {
    const el = tt && tt[key];
    if (!el) return "";
    const v = el.value;
    if (typeof v === "string") return stripHtml(v);
    if (v && typeof v === "object") {
      const val = typeof v.Element_001 === "string" ? v.Element_001 : v.Element_000;
      return typeof val === "string" ? stripHtml(val) : "";
    }
    return "";
  }

  // 진화/깨달음/도약 트리별로 투자 포인트와, 각 트리에 배치된 노드 목록을 정리한다.
  const arkPassiveTrees = useMemo(() => {
    const ap = detailData && detailData.arkpassive;
    if (!ap || !Array.isArray(ap.Points)) return [];
    const effects = Array.isArray(ap.Effects) ? ap.Effects : [];
    return ap.Points.map((p) => ({
      tree: p.Name,
      value: p.Value,
      desc: stripHtml(p.Description),
      nodes: effects
        .filter((e) => e && e.Name === p.Name)
        .map((e) => stripHtml(e.Description)),
    }));
  }, [detailData]);

  // 아크그리드 코어 6개 + 장착된 젬, 그리고 하단 옵션(스탯) 합계를 정리한다.
  const arkGridCores = useMemo(() => {
    const ag = detailData && detailData.arkgrid;
    if (!ag || !Array.isArray(ag.Slots)) return [];
    return ag.Slots.map((slot) => {
      const gems = Array.isArray(slot.Gems)
        ? slot.Gems.map((g) => {
            const tt = parseTooltipJson(g.Tooltip);
            return {
              grade: g.Grade,
              name: tooltipText(tt, "Element_000"),
              info: tooltipText(tt, "Element_004"),
              effect: tooltipText(tt, "Element_005"),
            };
          })
        : [];
      return { name: slot.Name, grade: slot.Grade, point: slot.Point, gems };
    });
  }, [detailData]);

  const arkGridEffects = useMemo(() => {
    const ag = detailData && detailData.arkgrid;
    if (!ag || !Array.isArray(ag.Effects)) return [];
    return ag.Effects.map((e) => ({
      name: e.Name,
      level: e.Level,
      text: stripHtml(e.Tooltip),
    }));
  }, [detailData]);

  const detailGemList = useMemo(() => {
    const g = detailData && detailData.gems;
    let list = [];
    if (g && Array.isArray(g.Gems)) list = g.Gems;
    else if (Array.isArray(g)) list = g;
    return [...list].sort((a, b) => gemLevelOf(b) - gemLevelOf(a));
  }, [detailData]);

  const daySchedule = useMemo(() => {
    return DAYS.map((d) => ({ day: d, segments: daySegments(members, d) })).filter((x) => x.segments.length > 0);
  }, [members]);

  const today = todayLabel();
  const todaySegments = useMemo(() => todaySegmentsWithCarryover(members, today), [members, today]);

  const selectedMember = selectedId && selectedId !== "new" ? memberById(selectedId) : null;

  // "오늘의 시간표"를 텍스트로 만들어 디스코드 웹훅(워커 경유)으로 전송한다.

        })

        .join(", ");
      return `**${fmt(seg.start)} ~ ${fmt(seg.end)}** — ${names}`;
    });
    const content = [
      `📅 **오늘(${today}요일)의 게임 가능 시간표**`,
      ...(lines.length ? lines : ["등록된 시간이 없습니다."]),
    ].join("\n");
    try {
      const res = await fetch(LOSTARK_PROXY_URL + "?type=discord_share", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content }),
      });
      if (res.ok) alert("디스코드로 공유했어요!");
      else alert("공유에 실패했습니다. (워커에 디스코드 웹훅이 설정돼 있는지 확인해주세요)");

      alert("공유에 실패했습니다.");
    }
  }


  return (
    <div style={styles.page}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=Chakra+Petch:wght@500;600;700&display=swap');
        * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        html, body { overflow-x: hidden; max-width: 100%; }
        .rb-num { font-family: 'Chakra Petch', 'Noto Sans KR', sans-serif; }

        @media (max-width: 640px) {
          .my-info-grid { grid-template-columns: 1fr !important; }
          .hero-divider { display: none; }
        }
      `}</style>

      <div style={styles.hero}>
        <div
          style={{ cursor: "pointer" }}
          onClick={() => window.location.reload()}
          title="클릭하면 새로고침됩니다"
        >
          <div style={styles.heroEyebrow}>연고</div>

        </div>
        <a
          href="https://discord.gg/GGBSmCWKHk"

      {onlineCount > 0 && (

                        setRosterChars(await fetchRosterChars(repName));
                      } finally {
                        setRosterLoading(false);
                      }
                    }}
                  >
                    다시 시도
                  </button>
                </div>
              </div>
            ) : (
              <div>
                {rosterChars.map((c) => (
                  <div
                    key={c.name}
                    style={styles.rosterRow}
                    onClick={() => {
                      closeRosterView();
                      openDetail(
                        c.name,
                        rosterChars.map((rc) => ({ id: rc.name, name: rc.name }))
                      );
                    }}
                  >
                    <span
                      style={{
                        color: "#f2ede0",
                        fontWeight: 700,
                        fontSize: 15,
                        overflowWrap: "break-word",
                      }}
                    >
                      {c.name}
                    </span>
                    <ClassEmblem className={c.className} size={22} />
                    <span style={{ color: "#e8ebf0", fontWeight: 700 }}>{c.className}</span>
                    <span style={{ color: "#c48cf0", fontSize: 12 }}>{c.spec || "-"}</span>
                    <span style={{ color: "#e2593f", fontWeight: 700, textAlign: "right" }}>
                      {c.level != null ? c.level.toFixed(2) : "-"}
                    </span>
                    <span style={{ color: "#4fa8e0", textAlign: "right" }}>
                      {c.combatPower != null
                        ? c.combatPower.toLocaleString("ko-KR", { maximumFractionDigits: 2 })
                        : "-"}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {detailFor && (
        <div style={styles.modalOverlay} onClick={closeDetail}>
          <div style={styles.modalPanel} onClick={(e) => e.stopPropagation()}>
            <div style={styles.modalHeader}>
              <div style={styles.modalTitle}>{detailFor}</div>
              <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                {detailMemberChars && detailMemberChars.length > 1 && (
                  <button style={styles.ghostBtnSmall} onClick={backToRosterFromDetail}>
                    ← 원정대로 돌아가기
                  </button>
                )}
                <button
                  style={styles.refreshBtn}
                  onClick={() => openDetail(detailFor, detailMemberChars)}
                  disabled={detailLoading}
                >
                  {detailLoading ? "불러오는 중..." : "갱신"}
                </button>
                <button style={styles.modalClose} onClick={closeDetail}>
                  ✕
                </button>
              </div>
            </div>

            {detailLoading ? (
              <div style={styles.emptyHint}>불러오는 중...</div>
            ) : detailError ? (
              <div style={styles.errorText}>{detailError}</div>
            ) : detailData ? (
              <>
                <div style={styles.modalSubtitle}>
                  {detailData.profile.CharacterClassName}
                  {extractSpecName(detailData.arkpassive) && (
                    <span style={styles.specName}> · {extractSpecName(detailData.arkpassive)}</span>
                  )}
                  {detailData.profile.Title ? ` · ${detailData.profile.Title}` : ""}
                  {detailData.profile.GuildName ? ` · ${detailData.profile.GuildName}` : ""}
                </div>
                <div style={styles.modalStatRow}>
                  <span>아이템 Lv.{detailData.profile.ItemAvgLevel}</span>
                  {detailData.profile.CombatPower && <span>⚔ {detailData.profile.CombatPower}</span>}
                </div>

                {Array.isArray(detailData.profile.Stats) && detailData.profile.Stats.length > 0 && (
                  <div style={styles.modalSection}>
                    <div style={styles.modalSectionTitle}>주요 스탯</div>
                    <div style={styles.modalChipRow}>
                      {detailData.profile.Stats.map((s, i) => (
                        <span key={i} style={styles.modalChip}>
                          {s.Type} {s.Value}
                        </span>
                      ))}
                    </div>
                  </div>
                )}

                {(() => {
                  const ACCESSORY_TYPES = ["목걸이", "귀걸이", "반지", "팔찌", "어빌리티 스톤"];
                  const renderEquipRow = (eq, i) => {
                    const isAccessory = ACCESSORY_TYPES.includes(eq.Type);
                    const parsed = isAccessory ? extractTooltipOptionLines(eq.Tooltip) : { lines: [], items: [], raw: "" };
                    const cleanName = (eq.Name || "").replace(/<[^>]+>/g, "");
                    const lvlColor = enhanceLevelColor(cleanName);
                    return (
                      <div key={i} style={styles.modalEquipBlock}>
                        <div style={styles.modalListRow}>
                          <span style={styles.modalListType}>{eq.Type}</span>
                          <span
                            style={{
                              ...styles.modalListName,
                              ...(lvlColor ? { color: lvlColor, fontWeight: 700 } : {}),
                            }}
                          >
                            {cleanName}
                          </span>
                        </div>
                        {parsed.items.length > 0 && (
                          <div style={styles.modalOptionBox}>
                            {parsed.items.map((it, li) => {
                              const statColor = it.statLine ? statLineColor(it.name, it.value) : null;
                              const ctx = it.statLine
                                ? ""
                                : [parsed.items[li - 1] && parsed.items[li - 1].name, it.name, parsed.items[li + 1] && parsed.items[li + 1].name]
                                    .filter(Boolean)
                                    .join(" ");
                              const grade = it.statLine
                                ? null
                                : eq.Type === "팔찌"
                                ? gradeFromBraceletText(it.name, ctx)
                                : gradeFromValue(it.name, it.value);
                              return (
                                <div
                                  key={li}
                                  style={{
                                    ...styles.modalOptionLine,
                                    color: grade ? GRADE_COLORS[grade] : statColor ? statColor : styles.modalOptionLine.color,
                                    fontWeight: grade || statColor ? 700 : 400,
                                  }}
                                >
                                  {it.name}
                                  {it.value ? ` ${it.value}` : ""}
                                  {grade ? ` (${grade})` : ""}
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  };
                  const gearRows = detailEquipList
                    .map((eq, i) => ({ eq, i }))
                    .filter(({ eq }) => !ACCESSORY_TYPES.includes(eq.Type));
                  const accessoryRows = detailEquipList
                    .map((eq, i) => ({ eq, i }))
                    .filter(({ eq }) => ACCESSORY_TYPES.includes(eq.Type));
                  return (
                    <>
                      {gearRows.length > 0 && (
                        <div style={styles.modalSection}>
                          <div style={styles.modalSectionTitle}>장비</div>
                          {gearRows.map(({ eq, i }) => renderEquipRow(eq, i))}
                        </div>
                      )}
                      {accessoryRows.length > 0 && (
                        <div style={styles.modalSection}>
                          <div style={styles.modalSectionTitle}>악세사리</div>
                          {accessoryRows.map(({ eq, i }) => renderEquipRow(eq, i))}
                        </div>
                      )}
                    </>
                  );
                })()}

                <div style={styles.modalSection}>
                  <div style={styles.modalSectionTitle}>아크그리드</div>
                  {arkGridCores.length > 0 ? (
                    <>
                      {arkGridCores.map((c, ci) => (
                        <div
                          key={ci}
                          style={{
                            display: "flex",
                            justifyContent: "space-between",
                            alignItems: "baseline",
                            fontSize: 12,
                            padding: "3px 0",
                          }}
                        >
                          <span style={{ color: "#c8cddb" }}>{c.name}</span>
                          <span style={{ color: gradeColor(c.grade), fontWeight: 700, whiteSpace: "nowrap", marginLeft: 8 }}>
                            {c.grade} · {c.point}P
                          </span>
                        </div>
                      ))}
                      {arkGridEffects.length > 0 && (
                        <>
                          <div style={{ fontSize: 12, fontWeight: 700, color: "#d9a94e", marginTop: 10 }}>
                            옵션 합계
                          </div>
                          {arkGridEffects.map((e, ei) => (
                            <div key={ei} style={{ fontSize: 11, color: "#c8cddb", padding: "2px 0 2px 8px" }}>
                              {e.name} Lv.{e.level} · {e.text}
                            </div>
                          ))}
                        </>
                      )}
                    </>
                  ) : (
                    <div style={styles.emptyHint}>아크그리드 정보를 가져오지 못했습니다.</div>
                  )}
                </div>

                {detailGemList.length > 0 && (
                  <div style={styles.modalSection}>
                    <div style={styles.modalSectionTitle}>보석</div>
                    <div style={styles.modalChipRow}>
                      {detailGemList.map((g, i) => {
                        const lvl = gemEffectiveLevel(g);
                        const gemColor = lvl >= 10 ? "#f5d949" : lvl === 9 ? "#c58cf5" : lvl === 8 ? "#5ec9e8" : "#e8ebf0";
                        return (
                          <span key={i} style={{ ...styles.modalChip, color: gemColor, fontWeight: lvl >= 8 ? 700 : 400 }}>
                            {(g.Name || "").replace(/<[^>]+>/g, "")}
                          </span>
                        );
                      })}
                    </div>
                    {(() => {
                      const counts = {};
                      detailGemList.forEach((g) => {
                        const lvl = gemEffectiveLevel(g);
                        counts[lvl] = (counts[lvl] || 0) + 1;
                      });
                      const levels = Object.keys(counts)
                        .map(Number)
                        .sort((a, b) => b - a);
                      return (
                        <div style={styles.gemSummaryRow}>
                          {levels.map((lvl, i) => {
                            const gemColor = lvl >= 10 ? "#f5d949" : lvl === 9 ? "#c58cf5" : lvl === 8 ? "#5ec9e8" : "#e8ebf0";
                            return (
                              <span key={lvl}>
                                {i > 0 && <span style={{ color: "#3a4152" }}> · </span>}
                                <span style={{ color: gemColor, fontWeight: 700 }}>
                                  {lvl}레벨 × {counts[lvl]}개
                                </span>
                              </span>
                            );
                          })}
                        </div>
                      );
                    })()}
                  </div>
                )}

                <div style={styles.modalSection}>
                  <div style={styles.modalSectionTitle}>각인</div>
                  {detailEngravingList.length > 0 ? (
                    <div style={styles.modalChipRow}>
                      {detailEngravingList.map((e, i) => {
                        const name = (e.Name || "").replace(/<[^>]+>/g, "");
                        let lvl = null;
                        if (typeof e.Level === "number") lvl = e.Level;
                        else {
                          const m = (name + " " + (e.Description || "")).match(/Lv\.?\s*(\d+)/i);
                          if (m) lvl = m[1];
                        }
                        return (
                          <span
                            key={i}
                            style={{ ...styles.modalChip, color: engravingLevelColor(lvl), fontWeight: 700 }}
                          >
                            {name}
                            {lvl ? ` Lv.${lvl}` : ""}
                          </span>
                        );
                      })}
                    </div>
                  ) : (
                    <div style={styles.emptyHint}>각인 정보를 가져오지 못했습니다.</div>
                  )}
                </div>

                <div style={styles.modalSection}>
                  <div style={styles.modalSectionTitle}>아크패시브</div>
                  {arkPassiveTrees.length > 0 ? (
                    arkPassiveTrees.map((t, ti) => (
                      <div key={ti} style={{ marginBottom: 10 }}>
                        <div style={{ fontSize: 12, fontWeight: 700, color: "#d9a94e", marginBottom: 4 }}>
                          {t.tree} · {t.value}P{t.desc ? ` (${t.desc})` : ""}
                        </div>
                        {t.nodes.length > 0 ? (
                          t.nodes.map((n, ni) => (
                            <div key={ni} style={{ fontSize: 11, color: "#c8cddb", padding: "2px 0 2px 8px" }}>
                              {n}
                            </div>
                          ))
                        ) : (
                          <div style={styles.emptyHint}>투자된 노드가 없습니다.</div>
                        )}
                      </div>
                    ))
                  ) : (
                    <div style={styles.emptyHint}>아크패시브 정보를 가져오지 못했습니다.</div>
                  )}
                </div>

                {detailEquipList.length === 0 && detailEngravingList.length === 0 && detailGemList.length === 0 && (
                  <div style={styles.emptyHint}>장비/각인/보석 정보를 가져오지 못했습니다 (프로필 정보만 표시).</div>
                )}
              </>
            ) : null}
          </div>
        </div>
      )}

      {showAccessLog && (
        <div style={styles.modalOverlay} onClick={() => setShowAccessLog(false)}>
          <div style={styles.modalPanel} onClick={(e) => e.stopPropagation()}>
            <div style={styles.modalHeader}>
              <div style={styles.modalTitle}>접속 기록 (최근 30건)</div>
              <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                <button style={styles.dangerBtn} onClick={clearAccessLog}>
                  기록 삭제
                </button>
                <button style={styles.modalClose} onClick={() => setShowAccessLog(false)}>
                  ✕
                </button>
              </div>
            </div>
            <div style={{ padding: "0 20px 20px" }}>
              {accessLogEntries.length === 0 ? (
                <div style={styles.emptyHint}>기록이 없습니다.</div>
              ) : (
                accessLogEntries.map((e, i) => (
                  <div
                    key={i}
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      alignItems: "center",
                      fontSize: 12,
                      padding: "4px 0",
                      borderBottom: "1px solid #1c212c",
                      gap: 8,
                    }}
                  >
                    <span style={{ color: e.name ? "#e8ebf0" : e.remembered ? "#8b93a7" : "#5f6577" }}>
                      {e.name ? e.name : e.remembered ? `추정: ${e.remembered}` : "익명"}
                    </span>
                    <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ color: "#5f6577" }}>{new Date(e.time).toLocaleString("ko-KR")}</span>
                      <button
                        style={styles.accessLogDeleteBtn}
                        onClick={() => deleteAccessLogEntry(e)}
                        title="이 기록만 삭제"
                      >
                        ✕
                      </button>
                    </span>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      )}

      {showArkgridInfo && (
        <div style={styles.modalOverlay} onClick={() => setShowArkgridInfo(false)}>
          <div style={{ ...styles.modalPanel, maxWidth: 900 }} onClick={(e) => e.stopPropagation()}>
            <div style={styles.modalHeader}>
              <div style={styles.modalTitle}>
                아크그리드 <span style={{ fontSize: 12, fontWeight: 400, color: "#5f6577" }}>(기준일 : 26.07.31)</span>
              </div>
              <button style={styles.modalClose} onClick={() => setShowArkgridInfo(false)}>
                ✕
              </button>
            </div>
            <div style={{ padding: "0 20px 20px" }}>
              {Object.keys(ARKGRID_SPECIES_TREE).map((sp) => (
                <button
                  key={sp}
                  style={{
                    ...styles.debugToggleBtn,
                    marginRight: 6,
                    marginBottom: 6,
                    ...(arkgridSpecies === sp ? { borderColor: "#d9a94e", color: "#d9a94e" } : {}),
                  }}
                  onClick={() => {
                    setArkgridSpecies(sp);
                    setArkgridClass(ARKGRID_SPECIES_TREE[sp][0]);
                    setArkgridBuild(null);
                  }}
                >
                  {sp}
                </button>
              ))}
              <button
                style={{
                  ...styles.debugToggleBtn,
                  marginRight: 6,
                  marginBottom: 6,
                  ...(arkgridClass === "공용" && !arkgridSpecies ? { borderColor: "#d9a94e", color: "#d9a94e" } : {}),
                }}
                onClick={() => {
                  setArkgridSpecies(null);
                  setArkgridClass("공용");
                  setArkgridBuild(null);
                }}
              >
                공용
              </button>
              <div style={{ borderTop: "1px solid #262d3d", margin: "8px 0 10px" }} />
              {arkgridSpecies &&
                ARKGRID_SPECIES_TREE[arkgridSpecies].map((cls) => (
                  <button
                    key={cls}
                    style={{
                      ...styles.debugToggleBtn,
                      marginLeft: 0,
                      marginRight: 6,
                      marginBottom: 6,
                      ...(arkgridClass === cls ? { borderColor: "#4fa8e0", color: "#4fa8e0" } : {}),
                    }}
                    onClick={() => {
                      setArkgridClass(cls);
                      setArkgridBuild(null);
                    }}
                  >
                    {cls}
                  </button>
                ))}

              {arkgridClass && (ARKGRID_INFO[arkgridClass] || ARKGRID_COMMON_INFO[arkgridClass]) ? (
                (() => {
                  const builds = ARKGRID_INFO[arkgridClass] || ARKGRID_COMMON_INFO[arkgridClass];
                  const buildKeys = Object.keys(builds);
                  const activeBuild = arkgridBuild && builds[arkgridBuild] ? arkgridBuild : buildKeys[0];
                  const rows = builds[activeBuild];
                  const slots = ["해", "달", "별"];
                  const setCount = Math.max(...slots.map((s) => (rows[s] ? rows[s].length : 0)));
                  return (
                    <>
                      {buildKeys.length > 1 && (
                        <div style={{ display: "flex", gap: 6, marginBottom: 4, flexWrap: "wrap" }}>
                          {buildKeys.map((bk) => (
                            <button
                              key={bk}
                              style={{
                                ...styles.debugToggleBtn,
                                marginLeft: 0,
                                ...(activeBuild === bk ? { borderColor: "#d9a94e", color: "#d9a94e" } : {}),
                              }}
                              onClick={() => setArkgridBuild(bk)}
                            >
                              {bk}
                            </button>
                          ))}
                        </div>
                      )}
                      <div style={{ borderTop: "1px solid #262d3d", margin: "10px 0 14px" }} />
                      <div
                        style={{
                          display: "grid",
                          gridTemplateColumns: `repeat(${setCount}, 1fr)`,
                          gap: 8,
                        }}
                      >
                        {Array.from({ length: setCount }).map((_, colIdx) => (
                          <div key={colIdx} style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                            <div style={{ fontSize: 11, fontWeight: 700, color: "#5f6577", textAlign: "center" }}>
                              {colIdx + 1}
                            </div>
                            {slots.map((slot) => {
                              const core = rows[slot] && rows[slot][colIdx];
                              if (!core) return <div key={slot} />;
                              const key = `${arkgridClass}-${activeBuild}-${slot}-${colIdx}`;
                              const isOpen = !!arkgridOpenCores[key];
                              return (
                                <div
                                  key={slot}
                                  style={{
                                    border: "1px solid #262d3d",
                                    borderRadius: 8,
                                    padding: "8px 8px",
                                  }}
                                >
                                  <div
                                    style={{ cursor: "pointer" }}
                                    onClick={() =>
                                      setArkgridOpenCores((prev) => ({ ...prev, [key]: !prev[key] }))
                                    }
                                  >
                                    <div style={{ fontSize: 10, color: "#5f6577", marginBottom: 2 }}>{slot} 코어</div>
                                    <div style={{ fontSize: 12, fontWeight: 700 }}>
                                      <span style={{ color: "#e8ebf0" }}>{core.name}</span>
                                      {core.tag && (
                                        <span
                                          style={{
                                            marginLeft: 5,
                                            fontSize: 9,
                                            color: "#0f1219",
                                            background: "#d9a94e",
                                            borderRadius: 4,
                                            padding: "1px 4px",
                                          }}
                                        >
                                          {core.tag}
                                        </span>
                                      )}
                                      <span style={{ float: "right", color: "#5f6577", fontWeight: 400 }}>
                                        {isOpen ? "▴" : "▾"}
                                      </span>
                                    </div>
                                  </div>
                                  {isOpen && (
                                    <div style={{ marginTop: 6, paddingTop: 6, borderTop: "1px solid #1c212c" }}>
                                      {core.effects.map((ef, ei) => (
                                        <div key={ei} style={{ fontSize: 10, color: "#c8cddb", padding: "2px 0" }}>
                                          <span style={{ color: "#5ec9e8", fontWeight: 700 }}>{ef.label}</span>{" "}
                                          {renderGradedText(ef.text)}
                                        </div>
                                      ))}
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        ))}
                      </div>
                    </>
                  );
                })()
              ) : (
                <div style={styles.emptyHint}>
                  이 직업은 아직 데이터가 없습니다. 스크린샷 주시면 추가해드릴게요.
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("RaidBoard crashed:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div
          style={{
            padding: 20,
            color: "#e2593f",
            background: "#0f1219",
            minHeight: "100vh",
            fontFamily: "monospace",
            whiteSpace: "pre-wrap",
          }}
        >
          <h2 style={{ color: "#f2ede0" }}>화면에 오류가 발생했습니다</h2>
          <div style={{ marginBottom: 12 }}>{String((this.state.error && this.state.error.message) || this.state.error)}</div>
          <div style={{ fontSize: 12, color: "#8b93a7" }}>{String((this.state.error && this.state.error.stack) || "")}</div>
          <button
            style={{ marginTop: 16, padding: "8px 14px", background: "#d9a94e", color: "#241a08", border: "none", borderRadius: 8, cursor: "pointer" }}
            onClick={() => this.setState({ error: null })}
          >
            다시 시도
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(
  <ErrorBoundary>
    <RaidBoard />
  </ErrorBoundary>
);
</script>
