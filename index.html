  // (프로젝트 설정 > 일반 > 내 앱 > SDK 설정 및 구성 > 구성)
  // ====================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyA1_AZcZQnh3UpdP3WJxOzc5YUC8XtUVkc",
    authDomain: "raid-dda42.firebaseapp.com",
    projectId: "raid-dda42",
    storageBucket: "raid-dda42.firebasestorage.app",
    messagingSenderId: "775623601647",
    appId: "1:775623601647:web:c23f8fdfa9685758035a1a"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const COLLECTION = "raid_storage";

  // Claude 아티팩트의 window.storage API와 동일한 모양으로 만든 Firestore 어댑터.
  // 덕분에 아래 앱 코드는 거의 손대지 않고 그대로 재사용할 수 있습니다.
  window.storage = {
    get: async (key) => {
      const doc = await db.collection(COLLECTION).doc(key).get();
      if (!doc.exists) {
        const err = new Error("not found: " + key);
        err.notFound = true;
        throw err;
      }
      return { key, value: doc.data().value, shared: true };
    },
    set: async (key, value) => {
      await db.collection(COLLECTION).doc(key).set({ value });
      return { key, value, shared: true };
    },
    list: async (prefix) => {
      const snap = await db.collection(COLLECTION).get();
      const keys = [];
      snap.forEach((d) => {
        if (!prefix || d.id.startsWith(prefix)) keys.push(d.id);
      });
      return { keys, prefix, shared: true };
    },
    delete: async (key) => {
      await db.collection(COLLECTION).doc(key).delete();
      return { key, deleted: true, shared: true };
    },
  };
</script>

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;

}

  if (CLASS_ICON_MAP[className]) return CLASS_ICON_MAP[className];
  const h = hashStr(className || "");
  return { shape: FALLBACK_SHAPES[h % FALLBACK_SHAPES.length], color: FALLBACK_PALETTE[h % FALLBACK_PALETTE.length] };
}

function toMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

// returns [start, end] in minutes; if end <= start, treat the range as crossing midnight
function toRange(start, end) {
  const s = toMinutes(start);
  let e = toMinutes(end);
  if (e <= s) e += 24 * 60;
  return [s, e];
}

function daySegments(members, day) {
  const intervals = [];
  members.forEach((m) => {
    const s = m.schedule && m.schedule[day];
    if (s && s.enabled && s.start !== s.end) {
      const [start, end] = toRange(s.start, s.end);
      intervals.push({ id: m.id, start, end });
    }
  });
  if (intervals.length === 0) return [];
  const points = Array.from(new Set(intervals.flatMap((iv) => [iv.start, iv.end]))).sort((a, b) => a - b);
  const segments = [];
  for (let i = 0; i < points.length - 1; i++) {
    const t = points[i];
    const active = intervals.filter((iv) => iv.start <= t && iv.end > t).map((iv) => iv.id);
    if (active.length >= 1) segments.push({ start: t, end: points[i + 1], ids: active });
  }
  const blocks = [];
  segments.forEach((seg) => {
    const prev = blocks[blocks.length - 1];
    const sameSet = prev && prev.end === seg.start && prev.ids.length === seg.ids.length && prev.ids.every((id) => seg.ids.includes(id));
    if (sameSet) {
      prev.end = seg.end;
    } else {
      blocks.push({ ...seg });
    }
  });
  return blocks.sort((a, b) => a.start - b.start);
}

function fmt(mins) {
  const wrapped = ((mins % 1440) + 1440) % 1440;
  const h = String(Math.floor(wrapped / 60)).padStart(2, "0");
  const m = String(wrapped % 60).padStart(2, "0");
  return `${h}:${m}`;
}

function pad2(n) {
  return String(n).padStart(2, "0");
}

function splitTime(t) {
  const [h, m] = (t || "0:00").split(":").map(Number);
  return { h: h || 0, m: m || 0 };
}

function dayHoursLabel(s) {
  if (!s || !s.enabled || s.start === s.end) return null;
  const [start, end] = toRange(s.start, s.end);
  const totalMin = end - start;
  const hrs = totalMin / 60;
  const label = Number.isInteger(hrs) ? `${hrs}시간` : `${hrs.toFixed(1)}시간`;
  return label;
}

function timeAgo(ts) {
  if (!ts) return "";
  const diffMin = Math.floor((Date.now() - ts) / 60000);
  if (diffMin < 1) return "방금";
  if (diffMin < 60) return `${diffMin}분 전`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `${diffHr}시간 전`;
  return `${Math.floor(diffHr / 24)}일 전`;
}

function lastTuesday11pm(now) {
  const d = new Date(now);
  const day = d.getDay();
  const diff = (day - 2 + 7) % 7;
  d.setDate(d.getDate() - diff);
  d.setHours(23, 0, 0, 0);
  if (d.getTime() > now.getTime()) {
    d.setDate(d.getDate() - 7);
  }
  return d;
}

                if (m.characters && m.characters[0] && m.characters[0].name !== fx.correctName) {
                  m.characters = [...m.characters];
                  m.characters[0] = { ...m.characters[0], name: fx.correctName };
                  await window.storage.set("member:" + fx.id, JSON.stringify(m), true);
                }
              }
            } catch (e) {}
          }
        } catch (e) {}

        // 매주 화요일 23시가 지난 뒤 첫 접속에서 전체 요일별 시간을 초기화
        try {
          const target = lastTuesday11pm(new Date()).getTime();
          let lastReset = null;
          try {
            const r = await window.storage.get("meta:lastReset", true);
            lastReset = r && r.value ? Number(r.value) || 0 : 0;
          } catch (e) {
            if (e && e.notFound) lastReset = 0;
            // 그 외의 읽기 실패는 상태를 알 수 없으므로 이번엔 리셋을 건너뜀
          }
          if (lastReset !== null && lastReset < target) {
            await window.storage.set("meta:lastReset", String(target), true);
            const listed2 = await window.storage.list("member:", true);
            const keys2 = listed2 && listed2.keys ? listed2.keys : [];
            await Promise.all(
              keys2.map(async (k) => {
                try {
                  const r = await window.storage.get(k, true);
                  if (r && r.value) {
                    const m = JSON.parse(r.value);
                    m.schedule = emptySchedule();
                    if (Array.isArray(m.characters)) {
                      m.characters = m.characters.map((c) => (c ? { ...c, raidDone: false } : c));
                    }
                    await window.storage.set(k, JSON.stringify(m), true);
                  }
                } catch (e) {}
              })
            );
          }
        } catch (e) {}

        await loadMembers();
      } catch (e) {
        setError("초기 데이터를 불러오지 못했습니다.");
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  async function saveMember(updated) {
    setMembers((prev) => {
      const exists = prev.some((m) => m.id === updated.id);
      return exists ? prev.map((m) => (m.id === updated.id ? updated : m)) : [...prev, updated];
    });
    try {
      await window.storage.set("member:" + updated.id, JSON.stringify(updated), true);
    } catch (e) {
      setError("저장에 실패했습니다.");
    }
  }

  const loggedIn = members.find((m) => m.id === loggedInId) || null;

  useEffect(() => {
    if (loggedIn) {
      setScheduleDraft(loggedIn.schedule);
      setScheduleSaved(false);
      setRequestDraft(loggedIn.request || "");
      setRequestSaved(false);
    } else {
      setScheduleDraft(null);
      setRequestDraft("");
    }
  }, [loggedInId]);

  useEffect(() => {
    const myName = loggedIn && loggedIn.characters[0] ? loggedIn.characters[0].name : null;
    async function beat() {
      try {
        await window.storage.set(
          "presence:" + sessionIdRef.current,
          JSON.stringify({ name: myName, lastSeen: Date.now() }),
          true
        );
      } catch (e) {}
    }
    beat();
    const t = setInterval(beat, 20000);
    return () => clearInterval(t);
  }, [loggedInId, members.length]);

  // 다른 사람들의 접속 상태를 주기적으로 확인
  useEffect(() => {
    async function poll() {
      try {
        const listed = await window.storage.list("presence:", true);
        const keys = listed && listed.keys ? listed.keys : [];
        const fetched = await Promise.all(
          keys.map(async (k) => {
            try {
              const r = await window.storage.get(k, true);
              return r && r.value ? JSON.parse(r.value) : null;
            } catch (e) {
              return null;
            }
          })
        );
        const now = Date.now();
        const active = fetched.filter((p) => p && now - p.lastSeen < 60000);
        setOnlineCount(active.length);
        setOnlineNames(Array.from(new Set(active.map((p) => p.name).filter(Boolean))));
      } catch (e) {}
    }
    poll();
    const t = setInterval(poll, 15000);
    return () => clearInterval(t);
  }, []);

  const BOARD_KEY = "board:raid-request";
  const BOARD_MAX = 5;

  const loadBoard = useCallback(async () => {
    try {
      const r = await window.storage.get(BOARD_KEY, true);
      const data = r && r.value ? JSON.parse(r.value) : { posts: [] };
      setBoardPosts(Array.isArray(data.posts) ? data.posts : []);
    } catch (e) {
      setBoardPosts([]);
    }
  }, []);

  useEffect(() => {
    loadBoard();
    const t = setInterval(loadBoard, 15000);
    return () => clearInterval(t);
  }, [loadBoard]);

  async function postToBoard() {
    if (!loggedIn || !boardDraft.trim()) return;
    setBoardError("");
    try {
      const r = await window.storage.get(BOARD_KEY, true).catch(() => null);
      const current = r && r.value ? JSON.parse(r.value) : { posts: [] };
      const posts = Array.isArray(current.posts) ? current.posts : [];
      const newPost = {
        id: uid(),
        authorId: loggedInId,
        authorName: loggedIn.characters[0].name,
        text: boardDraft.trim(),
        createdAt: Date.now(),
      };
      const updated = [...posts, newPost].slice(-BOARD_MAX);
      await window.storage.set(BOARD_KEY, JSON.stringify({ posts: updated }), true);
      setBoardPosts(updated);
      setBoardDraft("");
    } catch (e) {
      setBoardError("등록에 실패했습니다.");
    }
  }

  function pickCard(id) {
    setSelectedId(id);
    setPassword("");
    setClaimPw("");
    setClaimPw2("");
    setError("");
  }

  function attemptLogin() {
    const m = members.find((x) => x.id === selectedId);
    if (!m) return;
    if (m.password === password) {
      setLoggedInId(m.id);
      setError("");
    } else {
      setError("비밀번호가 일치하지 않습니다.");
    }

  async function claimPassword() {
    const m = members.find((x) => x.id === selectedId);
    if (!m) return;
    if (!claimPw) {
      setError("비밀번호를 입력해주세요.");
      return;
    }
    if (claimPw !== claimPw2) {
      setError("비밀번호가 서로 다릅니다.");
      return;
    }
    await saveMember({ ...m, password: claimPw });
    setLoggedInId(m.id);
    setError("");
  }

  async function registerMember() {
    if (!regName.trim() || !regClass.trim() || !regPw) {
      setError("대표 캐릭터 이름, 직업, 비밀번호를 모두 입력해주세요.");
      return;
    }

      setError("비밀번호가 서로 다릅니다.");
      return;
    }
    const fresh = {
      id: uid(),
      password: regPw,
      createdAt: Date.now(),
      characters: [{ id: uid(), name: regName.trim(), className: regClass.trim(), role: roleOf(regClass.trim()), level: 1, raidDone: false }],
      schedule: emptySchedule(),
      request: "",
      requestClaims: [],
    };
    await saveMember(fresh);
    setLoggedInId(fresh.id);
    setSelectedId(fresh.id);
    setRegName("");
    setRegClass("");
    setRegPw("");
    setRegPw2("");
    setError("");

    setLoggedInId(null);
    setSelectedId(null);
    setPassword("");
    setConfirmDelete(false);

    if (!loggedIn) return;
    const id = loggedIn.id;
    try {
      await window.storage.delete("member:" + id, true);

      setError("삭제에 실패했습니다.");

  function openSlotEditor(idx) {
    const existing = loggedIn.characters[idx];
    setSlotDraft(existing ? { ...existing } : { name: "", className: "", role: "딜러", level: "" });
    setEditSlot(idx);

  async function saveSlot() {
    if (!slotDraft.name.trim()) return;
    const chars = [...loggedIn.characters];
    while (chars.length <= editSlot) chars.push(null);
    chars[editSlot] = {
      id: chars[editSlot] && chars[editSlot].id ? chars[editSlot].id : uid(),
      name: slotDraft.name.trim(),
      className: slotDraft.className.trim(),
      role: slotDraft.role,
      level: Number(slotDraft.level) || 0,
      raidDone: chars[editSlot] ? !!chars[editSlot].raidDone : false,
    };
    await saveMember({ ...loggedIn, characters: chars });
    setEditSlot(null);
  }

  async function toggleRaidDone(idx, done) {
    const chars = [...loggedIn.characters];
    if (!chars[idx]) return;
    chars[idx] = { ...chars[idx], raidDone: done };
    await saveMember({ ...loggedIn, characters: chars });
  }

  async function importFromLostArk() {
    if (!loggedIn || !loggedIn.characters[0]) return;
    const repName = loggedIn.characters[0].name;
    setImportLoading(true);
    setImportError("");
    try {
      const res = await fetch(LOSTARK_PROXY_URL + "?name=" + encodeURIComponent(repName));
      if (!res.ok) throw new Error("API 오류 (" + res.status + ")");
      const list = await res.json();
      if (!Array.isArray(list) || list.length === 0) {
        throw new Error("캐릭터를 찾을 수 없습니다: " + repName);
      }
      const parsed = list
        .map((c) => ({
          name: c.CharacterName,
          className: c.CharacterClassName,
          level: parseFloat(String(c.ItemAvgLevel).replace(/,/g, "")) || 0,
        }))
        .sort((a, b) => b.level - a.level)
        .slice(0, MAX_SLOTS);

      const withPower = await Promise.all(
        parsed.map(async (c) => {
          try {
            const pr = await fetch(LOSTARK_PROXY_URL + "?type=profile&name=" + encodeURIComponent(c.name));
            if (!pr.ok) return { ...c, combatPower: null };
            const profile = await pr.json();
            const cp = profile && profile.CombatPower ? parseFloat(String(profile.CombatPower).replace(/,/g, "")) : null;
            return { ...c, combatPower: cp };
          } catch (e) {
            return { ...c, combatPower: null };
          }
        })
      );

      const oldByName = {};
      loggedIn.characters.forEach((c) => {
        if (c) oldByName[c.name] = c;
      });

      const newChars = withPower.map((c) => ({
        id: oldByName[c.name] ? oldByName[c.name].id : uid(),
        name: c.name,
        className: c.className,
        role: roleOf(c.className),
        level: c.level,
        combatPower: c.combatPower,
        raidDone: oldByName[c.name] ? !!oldByName[c.name].raidDone : false,
      }));

      await saveMember({ ...loggedIn, characters: newChars });
    } catch (e) {
      setImportError(e.message || "불러오기에 실패했습니다.");
    } finally {
      setImportLoading(false);
    }
  }

  async function deleteSlot(idx) {
    if (idx === 0) return;
    const chars = [...loggedIn.characters];
    chars[idx] = null;
    await saveMember({ ...loggedIn, characters: chars.filter((c, i) => i < MAX_SLOTS) });
    setEditSlot(null);

  }

                                  type="checkbox"
                                  checked={!!c.raidDone}
                                  onChange={(e) => toggleRaidDone(idx, e.target.checked)}
                                />
                              </label>
                              <div style={{ ...styles.slotRole, color: roleInfo.color }}>{roleInfo.label}</div>
                              <div style={styles.slotName}>{c.name}</div>
                              <div style={styles.slotClass}>{c.className}</div>
                              <div className="rb-num" style={{ ...styles.slotLevel, color: roleInfo.color }}>
                                Lv.{c.level}
                              </div>
                              {c.combatPower ? (
                                <div className="rb-num" style={styles.slotPower}>
                                  ⚔ {Math.round(c.combatPower).toLocaleString("ko-KR")}
                                </div>
                              ) : null}
                            </>
                          ) : (
                            <div style={styles.slotEmpty}>+</div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                  <div style={styles.emptyHint}>체크박스: 이번 주 레이드 완료 표시 (매주 화요일 밤 11시 초기화)</div>
                  {editSlot !== null && (
                    <div style={styles.editorBox}>
                      <input
                        style={styles.input}
                        placeholder="캐릭터 이름"
                        value={slotDraft.name}
                        onChange={(e) => setSlotDraft({ ...slotDraft, name: e.target.value })}
                      />
                      <input
                        style={{ ...styles.input, marginTop: 8 }}
                        placeholder="직업"
                        value={slotDraft.className}
                        onChange={(e) => setSlotDraft({ ...slotDraft, className: e.target.value })}
                      />
                      <div style={{ display: "flex", gap: 8, margin: "10px 0" }}>
                        {["딜러", "서포터"].map((r) => (
                          <button
                            key={r}
                            onClick={() => setSlotDraft({ ...slotDraft, role: r })}
                            style={{
                              ...styles.roleToggle,
                              borderColor: ROLE[r].color,
                              background: slotDraft.role === r ? ROLE[r].bg : "transparent",
                              color: ROLE[r].color,
                            }}
                          >
                            {r}
                          </button>
                        ))}
                      </div>
                      <input
                        style={styles.input}
                        placeholder="레벨"
                        type="number"
                        value={slotDraft.level}
                        onChange={(e) => setSlotDraft({ ...slotDraft, level: e.target.value })}
                      />
                      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                        <button style={styles.primaryBtn} onClick={saveSlot}>
                          저장
                        </button>
                        {editSlot !== 0 && loggedIn.characters[editSlot] && (
                          <button style={styles.dangerBtn} onClick={() => deleteSlot(editSlot)}>
                            삭제
                          </button>
                        )}
                        <button style={styles.ghostBtn} onClick={() => setEditSlot(null)}>
                          취소
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                <div style={styles.panel}>
                  <div style={styles.panelTitle}>요일별 게임 가능 시간</div>
                  {scheduleDraft &&
                    DAYS.map((d) => {
                      const s = scheduleDraft[d];
                      const zeroLength = s.enabled && s.start === s.end;
                      const hoursLabel = dayHoursLabel(s);
                      const st = splitTime(s.start);
                      const et = splitTime(s.end);
                      return (
                        <div key={d}>
                          <div style={styles.dayRowLine}>
                            <label style={styles.dayCheckLabel}>
                              <input type="checkbox" checked={s.enabled} onChange={(e) => updateDay(d, { enabled: e.target.checked })} />
                              <span style={{ marginLeft: 6 }}>{d}</span>
                            </label>
                            <select
                              style={styles.timeSelect}
                              disabled={!s.enabled}
                              value={st.h}
                              onChange={(e) => updateDay(d, { start: pad2(Number(e.target.value)) + ":" + pad2(st.m) })}
                            >
                              {HOUR_OPTIONS_START.map((h) => (
                                <option key={h} value={h}>
                                  {pad2(h)}
                                </option>
                              ))}
                            </select>
                            <span>:</span>
                            <select
                              style={styles.timeSelect}
                              disabled={!s.enabled}
                              value={st.m}
                              onChange={(e) => updateDay(d, { start: pad2(st.h) + ":" + pad2(Number(e.target.value)) })}
                            >
                              {MINUTE_OPTIONS.map((m) => (
                                <option key={m} value={m}>
                                  {pad2(m)}
                                </option>
                              ))}
                            </select>
                            <span style={{ color: "#5f6577" }}>~</span>
                            <select
                              style={styles.timeSelect}
                              disabled={!s.enabled}
                              value={et.h}
                              onChange={(e) => updateDay(d, { end: pad2(Number(e.target.value)) + ":" + pad2(et.m) })}
                            >
                              {HOUR_OPTIONS_END.map((h) => (
                                <option key={h} value={h}>
                                  {pad2(h)}
                                </option>
                              ))}
                            </select>
                            <span>:</span>
                            <select
                              style={styles.timeSelect}
                              disabled={!s.enabled}
                              value={et.m}
                              onChange={(e) => updateDay(d, { end: pad2(et.h) + ":" + pad2(Number(e.target.value)) })}
                            >
                              {MINUTE_OPTIONS.map((m) => (
                                <option key={m} value={m}>
                                  {pad2(m)}
                                </option>
                              ))}
                            </select>
                            {hoursLabel && <span style={styles.hoursLabel}>{hoursLabel}</span>}
                          </div>
                          {zeroLength && (
                            <div style={styles.errorText}>시작 시간과 종료 시간이 같습니다. 시간을 다시 설정해주세요.</div>
                          )}
                        </div>
                      );
                    })}
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 12 }}>
                    <button style={styles.primaryBtn} onClick={saveSchedule}>
                      저장
                    </button>
                    {scheduleSaved && <span style={styles.savedHint}>저장됨 · 겹치는 시간에 반영됐어요</span>}
                  </div>
                </div>
              </div>

              <div style={styles.panel}>
                <div style={styles.panelTitle}>요청 사항</div>
                <input
                  style={styles.input}
                  placeholder="예: 하르카 서폿 구함"
                  value={requestDraft}
                  onChange={(e) => {
                    setRequestDraft(e.target.value);
                    setRequestSaved(false);
                  }}
                  onKeyDown={(e) => e.key === "Enter" && saveRequest()}
                />
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10 }}>
                  <button style={styles.primaryBtn} onClick={saveRequest}>
                    저장
                  </button>
                  {requestSaved && <span style={styles.savedHint}>저장됨</span>}
                </div>
              </div>
            </>
          )}

          <div style={styles.panel}>
            <div style={styles.panelTitle}>요일별 시간표</div>
            {daySchedule.length === 0 ? (
              <div style={styles.emptyHint}>아직 등록된 게임 시간이 없습니다.</div>
            ) : (
              daySchedule.map(({ day, segments }) => (
                <div key={day} style={styles.dayScheduleBlock}>
                  <div style={styles.overlapDay}>{day}요일</div>
                  {segments.map((seg) => {
                    const overlapCount = seg.ids.length;
                    const names = seg.ids
                      .slice(0, 8)
                      .map((id) => {
                        const m = memberById(id);
                        return m && m.characters[0] ? m.characters[0].name : null;
                      })
                      .filter(Boolean);
                    const extra = overlapCount - names.length;
                    return (
                      <div
                        key={day + seg.start + "-" + seg.end}
                        style={{
                          ...styles.segmentRow,
                          borderColor: overlapCount >= 2 ? "#d9a94e" : "#262d3d",
                          background: overlapCount >= 2 ? "#2a2210" : "#0f1219",
                        }}
                      >
                        <span className="rb-num" style={styles.segmentTime}>
                          {fmt(seg.start)} ~ {fmt(seg.end)}
                        </span>
                        <span style={styles.segmentNames}>
                          {names.join(", ")}
                          {extra > 0 ? ` 외 ${extra}명` : ""}
                        </span>
                        {overlapCount >= 2 && <span style={styles.overlapCount}>{overlapCount}명 겹침</span>}
                      </div>
                    );
                  })}
                </div>
              ))
            )}
          </div>
        </>
      )}
    </div>
  );
}

  boardAuthor: { fontSize: 12, fontWeight: 700, color: "#d9a94e", flexShrink: 0 },
