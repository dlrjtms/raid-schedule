    authDomain: "raid-dda42.firebaseapp.com",
    projectId: "raid-dda42",

    messagingSenderId: "775623601647",
    appId: "1:775623601647:web:c23f8fdfa9685758035a1a"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const COLLECTION = "raid_storage";

  // Claude 아티팩트의 window.storage API와 동일한 모양으로 만든 Firestore 어댑터.
  // 덕분에 아래 앱 코드는 거의 손대지 않고 그대로 재사용할 수 있습니다.
  window.storage = {
    get: async (key) => {
      const doc = await db.collection(COLLECTION).doc(key).get();
      if (!doc.exists) {
        const err = new Error("not found: " + key);
        err.notFound = true;
        throw err;
      }
      return { key, value: doc.data().value, shared: true };
    },
    set: async (key, value) => {
      await db.collection(COLLECTION).doc(key).set({ value });
      return { key, value, shared: true };
    },
    list: async (prefix) => {
      const snap = await db.collection(COLLECTION).get();
      const keys = [];
      snap.forEach((d) => {
        if (!prefix || d.id.startsWith(prefix)) keys.push(d.id);
      });
      return { keys, prefix, shared: true };
    },
    delete: async (key) => {
      await db.collection(COLLECTION).doc(key).delete();
      return { key, deleted: true, shared: true };
    },
  };

// 로스트아크 경매 입찰가/손익 계산 (수수료 5% 고정, 인원수 기반)
function computeAuctionRows(price, n) {
  if (!price || !n || n < 2) return [];
  const direct = (price * (n - 1)) / n;
  const bep = direct * 0.95;
  const marginRows = [0, 25, 50, 75, 100].map((L) => {
    const bid = bep / (1 + L / 1000);
    const profit = bid * (L / 1000);
    return { label: L === 0 ? "손익 분기점" : L === 100 ? "선점" : `${L}%`, bid, profit };
  });
  return [{ label: "직접 사용", bid: direct, profit: price - direct }, ...marginRows].map((r) => ({
    ...r,
    bid: Math.round(r.bid),
    profit: Math.round(r.profit),
  }));
}

// 캘린더 데이터에서 특정 키워드(카오스게이트/필드보스 등) 콘텐츠가 오늘 일정에 있는지 확인
function hasTodayContent(calendarData, keyword) {
  if (!Array.isArray(calendarData)) return false;
  const todayStr = new Date().toDateString();
  return calendarData.some((item) => {
    const label = `${item.CategoryName || ""} ${item.ContentsName || ""}`;
    if (!label.includes(keyword)) return false;
    const times = Array.isArray(item.StartTimes) ? item.StartTimes : [];
    return times.some((t) => {
      const d = new Date(t);
      return !isNaN(d) && d.toDateString() === todayStr;
    });
  });
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;

}

}

function toMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

// returns [start, end] in minutes; if end <= start, treat the range as crossing midnight
function toRange(start, end) {
  const s = toMinutes(start);
  let e = toMinutes(end);
  if (e <= s) e += 24 * 60;
  return [s, e];
}

function daySegments(members, day) {
  const intervals = [];
  members.forEach((m) => {
    const s = m.schedule && m.schedule[day];
    if (s && s.enabled && s.start !== s.end) {
      const [start, end] = toRange(s.start, s.end);
      intervals.push({ id: m.id, start, end });
    }
  });
  if (intervals.length === 0) return [];
  const points = Array.from(new Set(intervals.flatMap((iv) => [iv.start, iv.end]))).sort((a, b) => a - b);
  const segments = [];
  for (let i = 0; i < points.length - 1; i++) {
    const t = points[i];
    const active = intervals.filter((iv) => iv.start <= t && iv.end > t).map((iv) => iv.id);
    if (active.length >= 1) segments.push({ start: t, end: points[i + 1], ids: active });
  }
  const blocks = [];
  segments.forEach((seg) => {
    const prev = blocks[blocks.length - 1];
    const sameSet = prev && prev.end === seg.start && prev.ids.length === seg.ids.length && prev.ids.every((id) => seg.ids.includes(id));
    if (sameSet) {
      prev.end = seg.end;
    } else {
      blocks.push({ ...seg });
    }
  });
  return blocks.sort((a, b) => a.start - b.start);
}

function fmt(mins) {
  const wrapped = ((mins % 1440) + 1440) % 1440;
  const h = String(Math.floor(wrapped / 60)).padStart(2, "0");
  const m = String(wrapped % 60).padStart(2, "0");
  return `${h}:${m}`;
}

function pad2(n) {
  return String(n).padStart(2, "0");
}

function splitTime(t) {
  const [h, m] = (t || "0:00").split(":").map(Number);
  return { h: h || 0, m: m || 0 };
}

function dayHoursLabel(s) {
  if (!s || !s.enabled || s.start === s.end) return null;
  const [start, end] = toRange(s.start, s.end);
  const totalMin = end - start;
  const hrs = totalMin / 60;
  const label = Number.isInteger(hrs) ? `${hrs}시간` : `${hrs.toFixed(1)}시간`;
  return label;
}

function timeAgo(ts) {
  if (!ts) return "";
  const diffMin = Math.floor((Date.now() - ts) / 60000);
  if (diffMin < 1) return "방금";
  if (diffMin < 60) return `${diffMin}분 전`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `${diffHr}시간 전`;
  return `${Math.floor(diffHr / 24)}일 전`;
}

const GRADE_LABELS = ["상", "중", "하"];
const GRADE_COLORS = { 상: "#f5d949", 중: "#c58cf5", 하: "#5b9bd5" };

function gradeFromValue(name, valueStr) {
  if (!name || !valueStr) return null;
  const unit = valueStr.includes("%") ? "%" : "+";
  const num = parseFloat(valueStr.replace(/[+%,]/g, ""));
  if (Number.isNaN(num)) return null;
  const entry = GRADE_TABLE.find((t) => name.includes(t.match) && t.unit === unit);
  if (!entry) return null;
  const idx = entry.tiers.findIndex((v) => Math.abs(v - num) < 0.01);
  return idx === -1 ? null : GRADE_LABELS[idx];
}

function extractTooltipOptionLines(tooltipRaw) {
  const empty = { lines: [], items: [], raw: "" };
  if (!tooltipRaw) return empty;
  let obj;
  try {
    obj = JSON.parse(tooltipRaw);
  } catch (e) {
    return empty;
  }
  const rawLines = [];
  function walk(node) {
    if (node == null) return;
    if (typeof node === "string") {
      const stripped = node
        .replace(/<br\s*\/?>/gi, "\n")
        .replace(/<[^>]*>/g, "\n")
        .replace(/&nbsp;/g, " ");
      stripped
        .split("\n")
        .map((s) => s.trim())
        .filter(Boolean)
        .forEach((s) => rawLines.push(s));
    } else if (Array.isArray(node)) {
      node.forEach(walk);
    } else if (typeof node === "object") {
      Object.values(node).forEach(walk);
    }
  }
  walk(obj);

  const STOP_MARKERS = ["ItemPartBox", "MultiTextBox", "SingleTextBox", "Progress", "NameTagBox", "ItemTitle"];
  const STAT_ONLY = /^(체력|힘|민첩|지능)\s*[+\-]?[\d,.]+$/;

  function sectionChunk(marker) {
    const idx = rawLines.indexOf(marker);
    if (idx === -1) return null;
    const chunk = [];
    for (let i = idx + 1; i < rawLines.length; i++) {
      const l = rawLines[i];
      if (STOP_MARKERS.includes(l)) break;
      if (l === "IndentStringGroup") continue; // 하위 구조 표지, 건너뛰고 계속
      chunk.push(l);
    }
    return chunk;
  }

  const lines = [];
  const items = [];

  // [1] 목걸이/귀걸이/반지: "연마 효과" 구간에 [이름, 값, 이름, 값 ...] 순서로 나온다.
  let chunk = sectionChunk("연마 효과");
  if (chunk) {
    for (let i = 0; i < chunk.length; i += 2) {
      const name = chunk[i];
      const val = chunk[i + 1] || "";
      if (name) {
        lines.push(val ? `${name} ${val}` : name);
        items.push({ name, value: val });
      }
    }
  }

  // [2] 어빌리티 스톤: "세공 단계 보너스" 구간에 [ 이름 | Lv.N | ] 형태로 대괄호가 섞여 나온다.
  if (lines.length === 0) {
    chunk = sectionChunk("세공 단계 보너스");
    if (chunk) {
      const cleaned = chunk.filter((l) => l !== "[" && l !== "]" && l !== "레벨 보너스" && !STAT_ONLY.test(l));
      for (let i = 0; i < cleaned.length; i++) {
        const cur = cleaned[i];
        if (/^Lv\.?\s*\d+$/i.test(cur)) continue;
        const next = cleaned[i + 1];
        if (next && /^Lv\.?\s*\d+$/i.test(next)) {
          lines.push(`${cur} ${next}`);
          items.push({ name: cur, value: next });
          i++;
        } else if (/[%\d]/.test(cur) && cur !== "무작위 각인 효과") {
          lines.push(cur);
          items.push({ name: cur, value: "" });
        }
      }
    }
  }

  // [3] 팔찌: "팔찌 효과" 구간. 옵션 하나가 한 줄로 오는 경우도, "이름 문구 | N% | 증가한다."처럼
  // 퍼센트 값이 앞뒤 문구와 분리된 3줄로 오는 경우도 있어 앞뒤를 붙여서 완전한 문장으로 만든다.
  if (lines.length === 0) {
    chunk = sectionChunk("팔찌 효과");
    if (chunk) {
      const filtered = chunk.filter((l) => !STAT_ONLY.test(l));
      const used = new Set();
      for (let i = 0; i < filtered.length; i++) {
        if (used.has(i)) continue;
        const l = filtered[i];
        if (!l.includes("%")) continue;
        let prefix = "";
        if (
          i > 0 &&
          !used.has(i - 1) &&
          !filtered[i - 1].includes("%") &&
          !/^[+\-]?[\d,.]+$/.test(filtered[i - 1])
        ) {
          prefix = filtered[i - 1];
          used.add(i - 1);
        }
        let suffix = "";
        if (
          i + 1 < filtered.length &&
          !filtered[i + 1].includes("%") &&
          !/^[+\-]?[\d,.]+$/.test(filtered[i + 1])
        ) {
          suffix = filtered[i + 1];
          used.add(i + 1);
        }
        used.add(i);
        const combined = [prefix, l, suffix]
          .filter(Boolean)
          .join(" ")
          .replace(/\.$/, "")
          .trim();
        const finalText = combined.length > 60 ? combined.slice(0, 60) + "…" : combined;
        lines.push(finalText);
        items.push({ name: finalText, value: "" });
      }
    }
  }

  return { lines: lines.slice(0, 6), items: items.slice(0, 6), raw: rawLines.join(" | ") };
}

// 가장 최근에 지나간 "화요일 23:00" 시점을 구한다 (0=일, 2=화)
function lastTuesday11pm(now) {
  const d = new Date(now);
  const day = d.getDay();
  const diff = (day - 2 + 7) % 7;
  d.setDate(d.getDate() - diff);
  d.setHours(23, 0, 0, 0);
  if (d.getTime() > now.getTime()) {
    d.setDate(d.getDate() - 7);
  }
  return d;
}

  async function importFromLostArk() {
    if (!loggedIn || !loggedIn.characters[0]) return;
    const repName = loggedIn.characters[0].name;
    setImportLoading(true);
    setImportError("");
    try {
      const res = await fetch(LOSTARK_PROXY_URL + "?name=" + encodeURIComponent(repName));
      if (!res.ok) throw new Error("API 오류 (" + res.status + ")");
      const list = await res.json();
      if (!Array.isArray(list) || list.length === 0) {
        throw new Error("캐릭터를 찾을 수 없습니다: " + repName);
      }
      const parsed = list
        .map((c) => ({
          name: c.CharacterName,
          className: c.CharacterClassName,
          level: parseFloat(String(c.ItemAvgLevel).replace(/,/g, "")) || 0,
        }))
        .sort((a, b) => b.level - a.level)
        .slice(0, MAX_SLOTS);

      const withPower = await Promise.all(
        parsed.map(async (c) => {
          try {
            const pr = await fetch(LOSTARK_PROXY_URL + "?type=profile&name=" + encodeURIComponent(c.name));
            if (!pr.ok) return { ...c, combatPower: null };
            const profile = await pr.json();
            const cp = profile && profile.CombatPower ? parseFloat(String(profile.CombatPower).replace(/,/g, "")) : null;
            return { ...c, combatPower: cp };
          } catch (e) {
            return { ...c, combatPower: null };
          }
        })
      );

      const oldByName = {};
      loggedIn.characters.forEach((c) => {
        if (c) oldByName[c.name] = c;
      });

      const newChars = withPower.map((c) => ({
        id: oldByName[c.name] ? oldByName[c.name].id : uid(),
        name: c.name,
        className: c.className,
        role: roleOf(c.className),
        level: c.level,
        combatPower: c.combatPower,
        raidDone: oldByName[c.name] ? !!oldByName[c.name].raidDone : false,
      }));

      await saveMember({ ...loggedIn, characters: newChars });
    } catch (e) {
      setImportError(e.message || "불러오기에 실패했습니다.");
    } finally {
      setImportLoading(false);
    }
  }

  async function safeFetchJson(type, name) {

      const res = await fetch(LOSTARK_PROXY_URL + "?type=" + type + "&name=" + encodeURIComponent(name));
      if (!res.ok) return null;
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        return null;
      }
    } catch (e) {
      return null;
    }
  }

              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 12 }}>
                {RAID_CHEATSHEETS[selectedRaid].map((src, i) => (

                    key={i}
                    src={src}
                    alt={`${selectedRaid} 컨닝페이퍼 ${i + 1}`}

              <div style={styles.modalTitle}>레이드 보상 정보</div>

                ✕
              </button>
            </div>

              <div style={styles.rewardHeaderRow}>
                <span>레이드</span>
                <span>입장 레벨</span>
                <span>관문 수</span>
                <span>총 클리어 골드</span>

                  <span style={{ color: "#e8ebf0" }}>{r.name}</span>
                  <span className="rb-num">{r.level}</span>
                  <span>{r.gates}</span>
                  <span className="rb-num" style={{ color: "#d9a94e" }}>
                    {r.gold.toLocaleString("ko-KR")}
                  </span>
                  <span className="rb-num" style={{ color: "#8b93a7" }}>
                    {r.extra.toLocaleString("ko-KR")}
                  </span>
                </div>
              ))}
            </div>

        <div style={styles.modalOverlay} onClick={() => setShowSynergy(false)}>
          <div style={{ ...styles.modalPanel, maxWidth: 560 }} onClick={(e) => e.stopPropagation()}>

              <div style={styles.modalTitle}>직업 시너지</div>

                ✕
              </button>
            </div>

            <div style={styles.synergyLegendBox}>
              {Object.entries(SYNERGY_GLOSSARY).map(([abbr, full]) => (
                <div key={abbr} style={styles.synergyLegendLine}>
                  <span style={{ color: synergyTagColor(abbr), fontWeight: 700 }}>{abbr}</span> = {full}
                </div>
              ))}
              <div style={{ ...styles.synergyLegendLine, marginTop: 4, paddingTop: 6, borderTop: "1px solid #262d3d" }}>
                <span style={{ color: "#e8ebf0", fontWeight: 700 }}>흰색</span> = 무조건 채용하는 경우
              </div>
              <div style={styles.synergyLegendLine}>
                <span style={{ color: "#5ec9e8", fontWeight: 700 }}>하늘색</span> = 세팅따라 채용률이 다른 경우
              </div>
              <div style={styles.synergyLegendLine}>
                <span style={{ color: "#e2593f", fontWeight: 700 }}>빨간색</span> = 채용률이 0%에 근접하는 경우
              </div>
            </div>

            {CLASS_SYNERGY_GROUPS.map((group, gi) => (
              <div key={gi} style={styles.synergyGroup}>
                {group.map((c, ci) => (
                  <div key={ci} style={styles.synergyRow}>
                    <span style={styles.synergyClass}>{c.cls}</span>
                    <span>
                      {c.tags.map((t, ti) => (
                        <span key={ti}>
                          {ti > 0 && <span style={{ color: "#3a4152" }}> · </span>}
                          <span style={{ color: synergyTagColor(t), fontWeight: 700 }}>{t}</span>
                        </span>
                      ))}
                    </span>
                  </div>
                ))}
              </div>
            ))}
          </div>

        <div style={styles.modalOverlay} onClick={closeDetail}>

                      ...styles.charSwitchBtn,
                      ...(c.name === detailFor ? styles.charSwitchBtnActive : {}),

                    {c.name}
                  </button>
                ))}
              </div>

                    </div>
                  </div>
                )}

                {detailEquipList.length > 0 && (
                  <div style={styles.modalSection}>
                    <div style={styles.modalSectionTitle}>장비</div>
                    {detailEquipList.map((eq, i) => {
                      const isAccessory = ["목걸이", "귀걸이", "반지", "팔찌", "어빌리티 스톤"].includes(eq.Type);
                      const parsed = isAccessory ? extractTooltipOptionLines(eq.Tooltip) : { lines: [], items: [], raw: "" };
                      return (
                        <div key={i} style={styles.modalEquipBlock}>
                          <div style={styles.modalListRow}>
                            <span style={styles.modalListType}>{eq.Type}</span>
                            <span style={styles.modalListName}>{(eq.Name || "").replace(/<[^>]+>/g, "")}</span>

                              <button
                                style={styles.debugToggleBtn}
                                onClick={() => setDebugOpenIdx(debugOpenIdx === i ? null : i)}
                              >
                                {debugOpenIdx === i ? "원본 닫기" : "원본 보기"}
                              </button>
                            )}
                          </div>
                          {parsed.items.length > 0 && (
                            <div style={styles.modalOptionBox}>
                              {parsed.items.map((it, li) => {
                                const grade = gradeFromValue(it.name, it.value);
                                return (
                                  <div
                                    key={li}
                                    style={{
                                      ...styles.modalOptionLine,
                                      color: grade ? GRADE_COLORS[grade] : styles.modalOptionLine.color,
                                      fontWeight: grade ? 700 : 400,
                                    }}
                                  >
                                    {it.name}
                                    {it.value ? ` ${it.value}` : ""}
                                    {grade ? ` (${grade})` : ""}
                                  </div>
                                );
                              })}
                            </div>
                          )}
                          {debugOpenIdx === i && (
                            <div style={styles.debugBox}>
                              [파싱 결과] {JSON.stringify(parsed.lines)}
                              {"\n\n"}
                              [원본] {parsed.raw || "(원본 데이터 없음)"}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}

                <div style={styles.modalSection}>
                  <div style={styles.modalSectionTitle}>
                    각인
                    <button
                      style={styles.debugToggleBtn}
                      onClick={() => setDebugEngravingOpen((v) => !v)}
                    >
                      {debugEngravingOpen ? "원본 닫기" : "원본 보기"}
                    </button>
                  </div>
                  {detailEngravingList.length > 0 ? (
                    <div style={styles.modalChipRow}>
                      {detailEngravingList.map((e, i) => {
                        const name = (e.Name || "").replace(/<[^>]+>/g, "");
                        let lvl = null;
                        if (typeof e.Level === "number") lvl = e.Level;
                        else {
                          const m = (name + " " + (e.Description || "")).match(/Lv\.?\s*(\d+)/i);
                          if (m) lvl = m[1];
                        }
                        return (
                          <span key={i} style={styles.modalChip}>
                            {name}
                            {lvl ? ` Lv.${lvl}` : ""}
                          </span>
                        );
                      })}
                    </div>
                  ) : (
                    <div style={styles.emptyHint}>각인 정보를 가져오지 못했습니다.</div>
                  )}
                  {debugEngravingOpen && (
                    <div style={styles.debugBox}>{JSON.stringify(detailData.engravings)}</div>
                  )}
                </div>

                {detailGemList.length > 0 && (
                  <div style={styles.modalSection}>
                    <div style={styles.modalSectionTitle}>보석</div>
                    <div style={styles.modalChipRow}>
                      {detailGemList.map((g, i) => (
                        <span key={i} style={styles.modalChip}>
                          {(g.Name || "").replace(/<[^>]+>/g, "")}
                        </span>
                      ))}
                    </div>
                  </div>
                )}

                {detailEquipList.length === 0 && detailEngravingList.length === 0 && detailGemList.length === 0 && (
                  <div style={styles.emptyHint}>장비/각인/보석 정보를 가져오지 못했습니다 (프로필 정보만 표시).</div>
                )}
              </>
            ) : null}
          </div>
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("RaidBoard crashed:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div
          style={{
            padding: 20,
            color: "#e2593f",
            background: "#0f1219",
            minHeight: "100vh",
            fontFamily: "monospace",
            whiteSpace: "pre-wrap",
          }}
        >
          <h2 style={{ color: "#f2ede0" }}>화면에 오류가 발생했습니다</h2>
          <div style={{ marginBottom: 12 }}>{String((this.state.error && this.state.error.message) || this.state.error)}</div>
          <div style={{ fontSize: 12, color: "#8b93a7" }}>{String((this.state.error && this.state.error.stack) || "")}</div>
          <button
            style={{ marginTop: 16, padding: "8px 14px", background: "#d9a94e", color: "#241a08", border: "none", borderRadius: 8, cursor: "pointer" }}
            onClick={() => this.setState({ error: null })}
          >
            다시 시도
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(
  <ErrorBoundary>
    <RaidBoard />
  </ErrorBoundary>
);
</script>
