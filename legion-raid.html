<title>군단장 토벌전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 16:9 전장 한 장, HUD는 그 위에 얹는다. 화산 현무암 + 잉걸불 + 피, 반격만 청록 룬색 */
:root{
  color-scheme:dark;
  --basalt:#100d10; --ash:#1c171b; --slate:#2a2328; --bone:#ece2cf; --dim:#a39686;
  --ember:#ff7a2f; --blood:#d23a3a; --rune:#5fe0e6; --gold:#e8b85c;
  --display:'Song Myung','Nanum Myeongjo','Batang',serif;
  --ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--basalt);color:var(--bone);font-family:var(--ui);box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative;width:min(100%,calc((100dvh - 24px) * 1.7778));aspect-ratio:16/9;max-width:100%;
  container-type:inline-size;border-radius:6px;overflow:hidden;background:#07060a;box-shadow:0 0 0 1px #2c2228,0 20px 60px #000a}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}

/* 보스 바 */
#bossbar{position:absolute;left:22%;right:22%;top:2.2cqw}
.bname{display:flex;align-items:baseline;justify-content:center;gap:.8cqw;margin-bottom:.5cqw;text-shadow:0 2px 6px #000}
.bname small{font-size:1.05cqw;color:var(--dim);letter-spacing:.08em}
.bname b{font-family:var(--display);font-weight:400;font-size:2cqw;color:var(--bone)}
.bar{position:relative;height:1.35cqw;background:#0b090b;border:1px solid #5a463c;border-radius:2px;overflow:hidden}
#bnext,#bfill{position:absolute;inset:0}
#bfill{transform-origin:left;transition:transform .08s linear}
#bmult{position:absolute;right:.6cqw;top:50%;transform:translateY(-50%);font-size:1cqw;font-weight:700;text-shadow:0 1px 3px #000}
#stag{margin:.6cqw auto 0;width:70%;height:1.7cqw;background:#081517;border:1px solid #2f7f86;border-radius:2px;position:relative;overflow:hidden}
#stagfill{position:absolute;inset:0;background:linear-gradient(90deg,#2aa7b0,var(--rune));transform-origin:left}
#stagtime{position:absolute;left:0;bottom:0;height:.35cqw;background:#ffe08a}
#stag span{position:absolute;inset:0;display:grid;place-items:center;font-size:.95cqw;font-weight:800;letter-spacing:.04em;color:#e8ffff;text-shadow:0 1px 2px #000}
#timer{position:absolute;right:1.6cqw;top:1.6cqw;font-size:1.3cqw;color:var(--dim);font-weight:600}
#timer.warn{color:var(--blood)}
#phase{position:absolute;left:1.6cqw;top:1.6cqw;font-size:1cqw;color:var(--dim);letter-spacing:.1em}

/* 하단 */
#bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:1.4cqw;display:flex;flex-direction:column;align-items:center;gap:.5cqw}
.meters{display:flex;gap:.8cqw;align-items:center}
#php{position:relative;width:24cqw;height:1.3cqw;background:#120a0b;border:1px solid #5b3434;border-radius:2px;overflow:hidden}
#phpfill{position:absolute;inset:0;background:linear-gradient(90deg,#8e1d22,#d23a3a);transform-origin:left}
#phptext{position:absolute;inset:0;display:grid;place-items:center;font-size:.85cqw;font-weight:600;text-shadow:0 1px 2px #000}
#rage{position:relative;width:9cqw;height:1.3cqw;background:#170d06;border:1px solid #6b4220;border-radius:2px;overflow:hidden}
#ragefill{position:absolute;inset:0;background:linear-gradient(90deg,#a2421a,var(--ember));transform-origin:left}
#rage span{position:absolute;inset:0;display:grid;place-items:center;font-size:.75cqw;font-weight:700;letter-spacing:.1em;text-shadow:0 1px 2px #000}
#rage.full{box-shadow:0 0 1cqw var(--ember)}
#gkb{position:relative;width:9cqw;height:1.3cqw;background:#171206;border:1px solid #6b5a20;border-radius:2px;overflow:hidden}
#gkfill{position:absolute;inset:0;background:linear-gradient(90deg,#8a6a20,var(--gold));transform-origin:left}
#gkb span{position:absolute;inset:0;display:grid;place-items:center;font-size:.75cqw;font-weight:700;letter-spacing:.06em;text-shadow:0 1px 2px #000}
#gkb.full{box-shadow:0 0 1cqw var(--gold)}
#fyb{position:relative;width:9cqw;height:1.3cqw;background:#06171a;border:1px solid #2f7f86;border-radius:2px;overflow:hidden}
#fyfill{position:absolute;inset:0;background:linear-gradient(90deg,#2a7f86,#bfffe6);transform-origin:left}
#fyb span{position:absolute;inset:0;display:grid;place-items:center;font-size:.75cqw;font-weight:700;letter-spacing:.06em;text-shadow:0 1px 2px #000}
#fyb.full{box-shadow:0 0 1cqw var(--rune)}
#skills{display:grid;grid-template-columns:repeat(14,4.6cqw);gap:.35cqw}
.slot{position:relative;height:4.6cqw;background:linear-gradient(#2a2227,#151114);border:1px solid #4a3a36;border-radius:3px;overflow:hidden;display:grid;place-items:center}
.slot .nm{position:relative;z-index:1;font-size:.92cqw;font-weight:600;line-height:1.15;text-align:center;padding:0 .2cqw;word-break:keep-all}
.slot .k{position:absolute;z-index:1;left:.3cqw;top:.15cqw;font-size:.8cqw;font-weight:700;color:var(--gold)}
.slot .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.38);border-top:2px solid rgba(255,255,255,.55)}
.slot .n{position:absolute;inset:0;z-index:2;display:grid;place-items:center;font-size:1.8cqw;font-weight:800;color:#fff;text-shadow:0 0 .4cqw #000,0 1px 2px #000}
.slot.wide .k{font-size:.55cqw}
.slot.off{filter:grayscale(1) brightness(.6)}
.slot.ready{border-color:var(--ember);box-shadow:inset 0 0 .8cqw #ff7a2f88}
.slot .cnt{position:absolute;z-index:1;right:.3cqw;bottom:.1cqw;font-size:.85cqw;font-weight:800}
.slot.rdy{background:linear-gradient(#f6efe0,#d6cab2);border-color:#fff;color:#1a0d06}.slot.rdy .k,.slot.rdy .cnt{color:#8a4a10}
.slot.cool{background:linear-gradient(#b02a30,#6a1418);border-color:#e04848;color:#fff}.slot.cool .nm{opacity:.35}
.slot:not(.cool) .cd{display:none}
.slot .gauge,.tb .gauge{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffa24a,#b8401a);opacity:.85;transition:height .1s linear}
.slot.full,.tb.full{background:linear-gradient(#ffd27a,#ff7a2f);border-color:#fff;color:#1a0d06;box-shadow:0 0 1.2cqw var(--ember);animation:fullp .8s ease-in-out infinite alternate}
.slot.full .gauge,.tb.full .gauge{display:none}.slot.full .k,.tb.full .k{color:#6a2a08}
.slot.act,.tb.act{border-color:#ff5a30;box-shadow:0 0 1cqw #ff3a1a}.slot.act .gauge,.tb.act .gauge{background:linear-gradient(#ff6a3a,#a02010)}
@keyframes fullp{from{filter:brightness(1)}to{filter:brightness(1.25)}}
@media (prefers-reduced-motion:reduce){.slot.full,.tb.full{animation:none}}
#engr{position:absolute;right:1.4cqw;bottom:7.6cqw;display:flex;flex-direction:column;align-items:flex-end;gap:.3cqw;max-width:18cqw}
.chip{font-size:.75cqw;padding:.2cqw .6cqw;border:1px solid #5c4a3a;background:#1a1416cc;border-radius:2px;color:var(--gold)}
#buffs{position:absolute;left:1.4cqw;bottom:7.6cqw;display:flex;flex-direction:column;gap:.3cqw}
.buff{font-size:.8cqw;color:var(--bone);background:#1a1416cc;border-left:2px solid var(--ember);padding:.15cqw .6cqw}
#banner{position:absolute;left:0;right:0;top:27%;text-align:center;font-family:var(--display);font-size:2.4cqw;color:var(--bone);text-shadow:0 0 1.2cqw #000,0 0 .4cqw #000;opacity:0;transition:opacity .25s;text-wrap:balance;padding:0 10%}
#banner.show{opacity:1}

/* 오버레이 */
#ovl{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#1b1114cc,#07060aee);overflow:auto}
.screen{width:min(90%,66cqw);display:flex;flex-direction:column;gap:.8cqw;padding-block:1cqw}
.eyebrow{font-size:1cqw;letter-spacing:.3em;color:var(--ember)}
h1{font-family:var(--display);font-weight:400;font-size:3.8cqw;margin:0;line-height:1;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:3cqw;margin:0;text-wrap:balance}
.lede{font-size:1cqw;color:var(--dim);margin:0;line-height:1.5}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:.5cqw}
.stage{border:1px solid #3a2e2c;background:#151013;padding:.45cqw .9cqw;display:flex;flex-direction:column;gap:.2cqw;min-width:0}
.stage .no{font-size:.8cqw;color:var(--dim);letter-spacing:.12em}
.stage .ti{font-size:.78cqw;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .na{font-family:var(--display);font-size:1.3cqw}
.stage .st{font-size:.75cqw;font-weight:700;letter-spacing:.1em;margin-top:.2cqw}
.stage.open{border-color:var(--ember);background:linear-gradient(#2a1812,#151013)}
.stage.open .st{color:var(--ember)}
.stage.lock{opacity:.55}
.stage.done .st{color:var(--gold)}
button.stage{pointer-events:auto;cursor:pointer;text-align:left;font-family:var(--ui);color:var(--bone);border-radius:0;font-weight:400}
button.stage:hover{border-color:var(--gold)}
.stage.sel{outline:2px solid var(--rune);outline-offset:2px;background:linear-gradient(#1c3034,#151013)}
.pgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:.4cqw}.pcol{display:flex;flex-direction:column;gap:.4cqw;min-width:0}.pcol b{font-family:var(--display);font-weight:400;font-size:1.15cqw;margin-bottom:.2cqw;white-space:nowrap}
.pbtn{font-size:.78cqw;padding:.45cqw .35cqw;background:#1e1618;color:var(--bone);border:1px solid #5a4236;text-align:left;font-weight:600;word-break:keep-all}.pbtn:hover{border-color:var(--gold)}
#wrap.mob .pbtn{font-size:1.1cqw;padding:.7cqw .4cqw}#wrap.mob .pcol b{font-size:1.5cqw}
.slot.rush,.tb.rush{border-color:#ff5a3a!important;box-shadow:0 0 1.2cqw rgba(255,70,40,.8);animation:rushP .6s ease-in-out infinite}.slot.rush .nm,.tb.rush span{color:#ffd0c0;font-weight:900}@keyframes rushP{50%{box-shadow:0 0 2cqw rgba(255,90,50,1)}}
.dbtn{background:transparent;color:var(--dim);border:1px solid #5a4a44;padding:.5cqw 1.6cqw;font-size:1.1cqw}
.dbtn.on{background:var(--ember);color:#1a0d06;border-color:var(--ember)}
.hof{margin:.4cqw 0;max-height:21cqw;overflow:auto}.hof-head{font-family:var(--display);font-size:1.25cqw;color:var(--gold);letter-spacing:.18em;margin-bottom:.4cqw}
.hof-t{width:100%;border-collapse:collapse;font-size:.95cqw;color:var(--bone)}.hof-t th{color:#a89880;font-weight:600;text-align:left;padding:.25cqw .5cqw;border-bottom:1px solid #5a4236}.hof-t td{padding:.24cqw .5cqw;border-bottom:1px solid rgba(90,66,54,.4)}
.hof-t tr.top1 td:first-child{color:#ffd36b;font-weight:900}.hof-t tr.top2 td:first-child{color:#d8dce8;font-weight:900}.hof-t tr.top3 td:first-child{color:#e0a070;font-weight:900}.hof-t tr.hi td{background:rgba(255,200,80,.2);color:#fff3c8}
.hof-time{font-variant-numeric:tabular-nums;font-weight:700}.hof-l{color:#8fe39a;font-size:.8cqw}.hof-new{font-size:1.5cqw;color:#ffd36b;font-weight:900;letter-spacing:.06em;animation:hofBlink .9s steps(2) infinite}.hof-new b{color:#fff}
@keyframes hofBlink{50%{opacity:.45}}.hof-form{display:flex;gap:.6cqw;align-items:center;margin:.3cqw 0 .6cqw}.hof-form input{font-size:1.1cqw;padding:.45cqw .7cqw;background:#120c0c;color:#fff;border:1px solid var(--gold);width:17cqw;font-family:inherit}
.hof-form button{font-size:1.05cqw}.hof-err{font-size:.95cqw;color:#ff8a8a}.hof-who{font-size:1.05cqw;color:#e8d8b8}.hof-miss,.hof-empty{font-size:1cqw;color:#a89880;margin:.4cqw 0}.hof-tabs{display:flex;flex-wrap:wrap;gap:.4cqw}.hof-tab{padding:.4cqw .9cqw;font-size:.95cqw}.hof-screen .hof{max-height:24cqw}

#dh.on{background:var(--blood);color:#fff;border-color:var(--blood)}
#cmo.on,#cpc.on,#cfs.on{background:#2f8a90;color:#fff;border-color:#2f8a90}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:.2cqw 1cqw;font-size:.82cqw;color:var(--dim)}
.keys b{color:var(--bone);display:inline-block;min-width:3cqw;font-weight:700}
.row{display:flex;gap:1cqw;align-items:center;flex-wrap:wrap}
button{pointer-events:auto;font-family:var(--ui);font-size:1.2cqw;font-weight:700;color:#1a0d06;background:var(--ember);border:0;padding:.65cqw 2cqw;border-radius:3px;cursor:pointer}
button.ghost{background:transparent;color:var(--bone);border:1px solid #5a4a44}
button:focus-visible,.card:focus-visible{outline:2px solid var(--rune);outline-offset:3px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.55cqw}.lcard{pointer-events:auto;cursor:pointer;text-align:left;background:linear-gradient(#251a1a,#141012);border:1px solid #5a4236;padding:.75cqw .8cqw;border-radius:3px;display:flex;flex-direction:column;gap:.3cqw;color:var(--bone);font-weight:400;transition:transform .12s,border-color .12s}
.lcard .cn{font-family:var(--display);font-size:1.25cqw;color:#f2e6d0}.lcard .cd2{font-size:.82cqw;color:#bfae98;line-height:1.35}.lcard:hover{border-color:#a8805a}
.lcard.on{border-color:var(--gold);background:linear-gradient(#4a3418,#21170c);box-shadow:0 0 1.2cqw rgba(255,190,90,.35);transform:translateY(-.15cqw)}.lcard.on .cn{color:var(--gold)}
#wrap.mob .lcard .cn{font-size:1.7cqw}#wrap.mob .lcard .cd2{font-size:1.15cqw}#lgo:disabled{opacity:.4;cursor:default}

.card{pointer-events:auto;cursor:pointer;text-align:left;background:linear-gradient(#251a1a,#141012);border:1px solid #5a4236;padding:1.4cqw;border-radius:3px;display:flex;flex-direction:column;gap:.6cqw;color:var(--bone);font-weight:400}
.card:hover{border-color:var(--gold)}
.card .ix{font-size:.9cqw;color:var(--gold);font-weight:700}
.card .cn{font-family:var(--display);font-size:2cqw}
.card .cd2{font-size:1.05cqw;color:var(--dim);line-height:1.5}
.stats{display:flex;gap:2.4cqw;font-size:1.1cqw;color:var(--dim)}
.stats b{display:block;font-size:2cqw;color:var(--bone);font-weight:600}
.hint{font-size:.8cqw;color:var(--dim);margin:0;line-height:1.5}
#touch{color:var(--gold)}
#wrap.mob{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#tc{position:absolute;inset:0;pointer-events:none;touch-action:none}
.tguard{right:20cqw;bottom:19.5cqw;width:13cqw;height:13cqw;border-radius:50% !important;border:3px solid #ffd84a;background:radial-gradient(circle at 50% 40%,rgba(255,216,74,.55),rgba(90,60,6,.85));color:#fff6d0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqw;animation:tgPop .18s ease-out,tgPulse .7s ease-in-out infinite;box-shadow:0 0 2.4cqw rgba(255,210,60,.7)}
.tguard b{font-size:4.2cqw;line-height:1;text-shadow:0 0 1cqw rgba(0,0,0,.8)}.tguard span{font-size:1.25cqw;font-weight:800}
.tguard.now{background:radial-gradient(circle at 50% 40%,#fff3a0,#ffb81c);color:#3a2400;border-color:#fff;box-shadow:0 0 4cqw rgba(255,230,90,1);transform:scale(1.12)}.tguard.now b{text-shadow:none}
.tguard.cool{opacity:.55}.tguard.down{transform:scale(.92)}
@keyframes tgPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}@keyframes tgPulse{50%{box-shadow:0 0 3.6cqw rgba(255,210,60,1)}}

#tzone{position:absolute;left:0;bottom:0;width:40%;height:78%;pointer-events:auto;touch-action:none}
#tbase{position:absolute;width:13cqw;height:13cqw;margin:-6.5cqw 0 0 -6.5cqw;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,235,210,.3);pointer-events:none}
#tknob{position:absolute;left:50%;top:50%;width:6cqw;height:6cqw;margin:-3cqw 0 0 -3cqw;border-radius:50%;background:rgba(255,235,210,.32);border:2px solid rgba(255,235,210,.65)}
.tb{position:absolute;border-radius:.8cqw;pointer-events:auto;touch-action:none;background:rgba(18,12,14,.58);border:2px solid rgba(255,200,150,.45);color:var(--bone);font-size:1cqw;font-weight:700;padding:0;display:grid;place-items:center;overflow:hidden;-webkit-tap-highlight-color:transparent}
.tb span{position:relative;z-index:1;line-height:1.1;text-align:center;word-break:keep-all;padding:0 .3cqw;text-shadow:0 1px 2px #000}
.tb .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.34);border-top:2px solid rgba(255,255,255,.6)}
.tb .k{position:absolute;left:.35cqw;top:.15cqw;z-index:1;font-size:.8cqw;color:var(--gold)}
.tb .n{position:absolute;inset:0;z-index:2;display:grid;place-items:center;font-style:normal;font-size:2cqw;font-weight:800;color:#fff;text-shadow:0 0 .4cqw #000,0 1px 2px #000}
.tb:not(.cool) .cd{display:none}.tb.cool span{opacity:.3}.tb.cool{background:rgba(168,34,40,.86);border-color:#e04848;color:#fff}
.tb.rdy{background:rgba(244,236,220,.9);border-color:#fff;color:#1a0d06}.tb.rdy span{text-shadow:none}.tb.rdy .k,.tb.rdy .cnt{color:#8a4a10}
.tb.big{border-radius:50%}.tb.big .k{left:50%;transform:translateX(-50%);top:.9cqw}
.tb.bar{border-radius:50%;font-size:1.7cqw}.tb.bar .k{left:50%;top:1.3cqw;transform:translateX(-50%)}
.tb .cnt{position:absolute;right:18%;bottom:12%;z-index:1;font-style:normal;font-size:.9cqw;color:var(--gold)}
.tb.big{border-color:var(--ember);font-size:1.4cqw}
.tb.ctr{border-color:#2f9aa2}.tb.ctr.ready{box-shadow:0 0 1.4cqw var(--rune);border-color:var(--rune)}
.tb.down{background:rgba(255,122,47,.5)}
.tb.off{opacity:.42}
.tb.ready{box-shadow:0 0 1.2cqw var(--ember)}
#tpause{left:1.2cqw;top:4.4cqw;width:3.8cqw;height:3.8cqw;border-radius:.6cqw;font-size:1.2cqw}#tpause .k,#tpause .n{display:none}
#tex{position:absolute;right:1.4cqw;bottom:13.7cqw;display:flex;gap:.5cqw;pointer-events:none}
.tb.ex{position:relative;width:4.3cqw;height:4.3cqw;border-radius:.8cqw;font-size:.8cqw}
.tb.ex .n{font-size:1.5cqw}
#wrap.mob #bottom{left:26cqw;transform:none;bottom:8.2cqw}
#wrap.mob #php{width:15cqw}
#wrap.mob #rage,#wrap.mob #gkb,#wrap.mob #fyb{width:5.5cqw}
#wrap.mob .meters{gap:.5cqw}
#tc.scroll .tb:not(.big):not(#tpause){display:none}#tc.scroll .tb[data-sp]{display:grid}
#wrap.mob #skills{display:none}
#wrap.mob #engr{bottom:auto;top:4.6cqw}
#wrap.mob #buffs{bottom:auto;top:9cqw;left:6cqw}
body.mob{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-block:0}
body.mob #wrap{width:min(100%,calc(100dvh * 1.7778));border-radius:0;box-shadow:none}
#wrap.mob .screen{width:min(94%,84cqw);gap:1cqw}
#wrap.mob h1{font-size:4.6cqw}#wrap.mob h2{font-size:3.6cqw}#wrap.mob .eyebrow{font-size:1.4cqw}
#wrap.mob .lede,#wrap.mob .stage .ti,#wrap.mob .stage .no{display:none}

<script>
(()=>{
'use strict';
const W=1280,H=720, AR={x:640,y:372,rx:560,ry:250};
const TIME_LIMIT=360;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let SC=1;
function fit(){const r=cv.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));SC=cv.width/W;}

const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
const ang=(ax,ay,bx,by)=>Math.atan2(by-ay,bx-ax);
const dist=(ax,ay,bx,by)=>Math.hypot(bx-ax,by-ay);
const adiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return Math.abs(d)};
const turnTo=(a,b,m)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return a+clamp(d,-m,m)};
const ease=k=>1-Math.pow(1-k,3);

function inArena(x,y,pad){const dx=(x-AR.x)/(AR.rx-pad),dy=(y-AR.y)/(AR.ry-pad);return dx*dx+dy*dy<=1}
function clampArena(o,pad){const dx=(o.x-AR.x)/(AR.rx-pad),dy=(o.y-AR.y)/(AR.ry-pad);const k=dx*dx+dy*dy;if(k>1){const s=1/Math.sqrt(k);o.x=AR.x+(o.x-AR.x)*s;o.y=AR.y+(o.y-AR.y)*s}}
function randInArena(pad){for(let i=0;i<80;i++){const x=rnd(AR.x-AR.rx,AR.x+AR.rx),y=rnd(AR.y-AR.ry,AR.y+AR.ry);if(inArena(x,y,pad)&&!inVoid(x,y,pad))return{x,y}}return{x:AR.x,y:AR.y}}
function rayLen(x,y,a,max,pad){for(let l=0;l<=max;l+=8){if(!inArena(x+Math.cos(a)*l,y+Math.sin(a)*l,pad))return Math.max(0,l-8)}return max}

function touches(s,x,y,r){
  switch(s.type){
    case 'circle':return dist(s.x,s.y,x,y)<=s.r+r;
    case 'cone':{const d=dist(s.x,s.y,x,y);if(d>s.range+r)return false;if(d<=r)return true;const tol=Math.asin(Math.min(1,r/d));return adiff(ang(s.x,s.y,x,y),s.a)<=s.arc/2+tol}
    case 'line':{const c=Math.cos(s.a),sn=Math.sin(s.a),dx=x-s.x,dy=y-s.y;const al=dx*c+dy*sn,pe=-dx*sn+dy*c;return al>=-r&&al<=s.len+r&&Math.abs(pe)<=s.w/2+r}
    case 'allbut':{for(const z of s.safe){if(dist(z.x,z.y,x,y)<=z.r-r*0.3)return false}return true}
  }
  return false;
}

/* ───── 데이터 ───── */

  {id:'gale',name:'질풍',desc:'이동 속도 +15%, 구르기 재사용 대기 -40%',f:s=>{s.move*=1.15;s.dodgeCd*=0.6}},

  {id:'crush',name:'분쇄자',desc:'무력화 수치 +60%',f:s=>{s.stag*=1.6}},
  {id:'fury',name:'격노 순환',desc:'분노 획득 +60%, 광폭화 지속 +4초',f:s=>{s.rage*=1.6;s.berserkDur+=4}},

  {id:'cliff',name:'벼랑 끝',desc:'생명력 35% 이하일 때 주는 피해 +45%',f:s=>{s.low+=0.45}},
  {id:'ember',name:'꺼지지 않는 불씨',desc:'쓰러지면 한 번, 생명력 40%로 일어선다',f:s=>{s.revive=1}},
  {id:'breath',name:'숨 고르기',desc:'초당 최대 생명력의 0.8% 회복',f:s=>{s.regen+=0.008}},
  {id:'weight',name:'대지의 무게',desc:'대지 가르기 피해 +50%, 무력화 2배',f:s=>{s.rendD*=1.5;s.rendS*=2}},
  {id:'flank',name:'그림자 칼날',desc:'후방 공격 피해 +15%p, 치명타 피해 +30%',f:s=>{s.back+=0.15;s.critMul+=0.3}},
];
function baseStats(){return{hp:1000,dmg:1,move:1,dodgeCd:1,leech:0,stag:1,rage:1,crit:0.12,critMul:1.8,cd:1,low:0,revive:0,regen:0,spinR:1,spinD:1,rendD:1,rendS:1,berserkDur:12,riposte:false,back:0.2}}
const SK={
  Q:{key:'C',nm:'참격',cd:0.42,lock:0.14},
  W:{key:'W',nm:'회전베기',cd:5,lock:0.24},
  E:{key:'Q',nm:'돌진베기',cd:7,lock:0.22},
  E2:{key:'E',nm:'파쇄 강타',cd:9,lock:1.0},
  R:{key:'R',nm:'대지 가르기',cd:13,lock:0.42},
  A:{key:'F',nm:'전투 함성',cd:22,lock:0.25},
  A2:{key:'A',nm:'도약 강타',cd:10,lock:0.62},
  S:{key:'S',nm:'피의 갈증',cd:20,lock:0.12},
  D:{key:'D',nm:'반격',cd:8,lock:0.22},
  F:{key:'Z',nm:'광폭화',cd:1,lock:0.3},
  SP:{key:'Space',nm:'구르기',cd:3.2},
  Z:{key:'1',nm:'회복약',cd:8},
  B2:{key:'2',nm:'피의 맹세',cd:10},
  K:{key:'Ctrl+Z',nm:'황금 기사',cd:1},
  X:{key:'Ctrl+X',nm:'요정 궁수',cd:1},

  V:{key:'V',nm:'버서커 퓨리',cd:60,lock:3.7},G:{key:'G',nm:'저스트 가드',cd:1.2,lock:0.22},
};
let SLOT_ORDER=['Q','E','W','E2','R','A2','S','D','A','F','V','SP','Z','B2','K'];
const KEYMAP={KeyC:'Q',KeyQ:'E',KeyW:'W',KeyE:'E2',KeyR:'R',KeyA:'A2',KeyS:'S',KeyD:'D',KeyF:'A',KeyZ:'F',Space:'SP',Digit1:'Z',Numpad1:'Z',Digit2:'B2',Numpad2:'B2',KeyV:'V',KeyG:'G'};

/* ───── 상태 ───── */
let state='title', S=baseStats(), picked=[], P, B, teles=[], rings=[], proj=[], fx=[], parts=[], texts=[], timers=[];
let fightTime=0, reviveUsed=false, shakeMag=0, flashA=0, flashCol='255,255,255', paused=false, best=null, cleared=false;
let bests={},unlocked=0;
try{bests=JSON.parse(localStorage.getItem('legion-raid-bests')||'{}')||{};const ob=JSON.parse(localStorage.getItem('legion-raid-best')||'null');if(ob&&!bests[0])bests[0]=ob}catch(e){bests={}}
try{unlocked=parseInt(localStorage.getItem('legion-raid-unlock')||'0',10)||0;if(localStorage.getItem('legion-raid-c1')==='1')unlocked=Math.max(unlocked,1)}catch(e){}
const keys={};

function maxHp(){return Math.round(S.hp)}
function recompute(){const old=P?maxHp():1000;S=baseStats();for(const id of picked){ENGR.find(e=>e.id===id).f(S)}if(reviveUsed)S.revive=0;if(P){P.hp=Math.min(maxHp(),P.hp*maxHp()/old)}}

function newPlayer(){return{x:AR.x,y:AR.y+110,r:15,hp:1000,face:-Math.PI/2,lock:0,inv:0,dodge:0,dvx:0,dvy:0,dash:0,dashV:{x:0,y:0},swing:0,swingD:0.2,swingK:'idle',swingS:1,cds:{},rage:0,hero:0,shield:0,stun:0,charm:0,mad:0,madT:0,inf:0,doom:0,sleep:0,berserk:0,warcry:0,thirst:0,potions:7,blood:3,bloodSt:0,walk:0,hurt:0,dead:false}}
function newBoss(){const d=BOSSDEF?BOSSDEF[stageIx]:{hp:60000,r:62};const hpv=Math.round(d.hp*(hard?1.5:1));return{armor:false,lastCrystal:-10,x:AR.x,y:AR.y-90,r:d.r,hp:hpv,maxHp:hpv,lastMirror:-8,lastGaze:-6,lastTether:-16,lastMasks:-6,lastCurtain:-14,mask:null,bowing:false,juggle:0,fadeIn:0,fadeOut:0,kiss:0,face:Math.PI/2,phase:1,act:null,cool:2,t:0,walk:0,z:0,slide:null,groggy:0,counterable:false,stagger:0,staggerMax:0,trans:0,hitFlash:0,last:'',lastCounter:-99,lastCollapse:-99,glow:0,dead:false,deathT:0,roarT:0,axeA:0.6,axe:null,armorBreak:0,bracing:false,braceHits:0,lastBrace:-6}}
let hard=false;try{hard=localStorage.getItem('legion-raid-hard')==='1'}catch(e){}
let pillars=[],knight=null,clones=[],stageIx=0,runStart=0,bgPix=null;
const BD=()=>BOSSDEF[stageIx];
P=newPlayer();B=newBoss();makePillars();

function later(t,fn){timers.push({t,fn})}
function shake(m){shakeMag=Math.max(shakeMag,m)}
function flash(a,c){flashA=Math.max(flashA,a);flashCol=c||'255,255,255'}
function addText(x,y,txt,col,size){texts.push({x:x+rnd(-14,14),y,txt,col,size:size||20,t:0})}
function burst(x,y,n,col,spd,life){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(spd*0.3,spd);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(life*0.5,life),max:life,c:col,sz:rnd(1.5,3.5)})}}

let bannerT=0;
function banner(txt,dur){const el=$('banner');el.textContent=txt;el.classList.add('show');bannerT=dur||2.2}

/* ───── 소리 ───── */
let AC=null, muted=false, noiseBuf=null;
/* ───── 사운드 v2 (판타지 액션 · 노이즈/포먼트 합성, 음정 있는 '띵' 소리 없음) ───── */
let MST=null,REV=null,lastHitA=0;const DISTC={};
function aInit(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();const sr=AC.sampleRate;noiseBuf=AC.createBuffer(1,sr*2,sr);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=10;comp.ratio.value=6;comp.attack.value=0.002;comp.release.value=0.2;
  MST=AC.createGain();MST.gain.value=0.9;MST.connect(comp);comp.connect(AC.destination);
  REV=AC.createConvolver();const n=Math.floor(sr*1.7),ir=AC.createBuffer(2,n,sr);for(let c=0;c<2;c++){const x=ir.getChannelData(c);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2)}REV.buffer=ir;const rg=AC.createGain();rg.gain.value=0.5;REV.connect(rg);rg.connect(comp)}
function shp(k){if(DISTC[k])return DISTC[k];const n=2048,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(k*x)/Math.tanh(k)}return DISTC[k]=c}
function aGain(t,vol,dur,o){const g=AC.createGain();const v=Math.max(0.0002,vol);g.gain.setValueAtTime(0.0001,t);
  if(o.swell){g.gain.exponentialRampToValueAtTime(v,t+dur*(o.peak||0.5));g.gain.exponentialRampToValueAtTime(0.0001,t+dur)}
  else{g.gain.exponentialRampToValueAtTime(v,t+(o.att||Math.min(0.004,dur*0.15)));g.gain.exponentialRampToValueAtTime(0.0001,t+dur)}return g}
function aOut(node,g,o){node.connect(g);g.connect(MST);if(o.rev){const r=AC.createGain();r.gain.value=o.rev;g.connect(r);r.connect(REV)}}
function nz(t,dur,vol,o){const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type=o.ft||'lowpass';f.Q.value=o.q||0.8;f.frequency.setValueAtTime(o.f0,t);
  if(o.fm){f.frequency.exponentialRampToValueAtTime(o.fm,t+dur*(o.peak||0.5));f.frequency.exponentialRampToValueAtTime(o.f1||o.f0,t+dur)}else if(o.f1)f.frequency.exponentialRampToValueAtTime(o.f1,t+dur);
  let node=f;if(o.dist){const w=AC.createWaveShaper();w.curve=shp(o.dist);f.connect(w);node=w}aOut(node,aGain(t,vol,dur,o),o);s.start(t,Math.random()*1.5);s.stop(t+dur+0.05)}
function vox(t,dur,vol,o){/* 포먼트를 통과한 톱니파: 짐승 울음/외침 */const os=AC.createOscillator();os.type=o.type||'sawtooth';os.frequency.setValueAtTime(o.f0,t);if(o.fm){os.frequency.linearRampToValueAtTime(o.fm,t+dur*0.35);os.frequency.exponentialRampToValueAtTime(o.f1||o.fm,t+dur)}else if(o.f1)os.frequency.exponentialRampToValueAtTime(o.f1,t+dur);
  if(o.jit){const l=AC.createOscillator(),lg=AC.createGain();l.type='sawtooth';l.frequency.value=o.jit[0];lg.gain.value=o.jit[1];l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+0.05)}
  const mix=AC.createGain();mix.gain.value=1;for(const [ff,q,gv] of (o.form||[[600,4,1],[1200,5,0.6]])){const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=ff;bp.Q.value=q;const gg=AC.createGain();gg.gain.value=gv;os.connect(bp);bp.connect(gg);gg.connect(mix)}
  let node=mix;if(o.dist){const w=AC.createWaveShaper();w.curve=shp(o.dist);mix.connect(w);node=w}
  const g=aGain(t,vol,dur,{att:o.att||0.06,swell:o.swell,peak:o.peak});
  if(o.growl){const am=AC.createGain();am.gain.value=0.55;const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.growl;lg.gain.value=0.45;l.connect(lg);lg.connect(am.gain);l.start(t);l.stop(t+dur+0.05);node.connect(am);node=am}
  aOut(node,g,o);os.start(t);os.stop(t+dur+0.05)}
function sub(t,dur,vol,f0,f1,o){o=o||{};const os=AC.createOscillator();os.type='sine';os.frequency.setValueAtTime(f0,t);os.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);aOut(os,aGain(t,vol,dur,o),o);os.start(t);os.stop(t+dur+0.05)}
function grit(t,dur,n,vol,o){for(let i=0;i<n;i++){const k=i/n;nz(t+k*dur+Math.random()*dur/n,0.014+Math.random()*0.02,vol*(1-k*0.6)*(0.6+Math.random()*0.4),{ft:o.ft||'bandpass',f0:(o.f||1500)*(0.7+Math.random()*0.6),q:o.q||1.5,dist:o.dist,att:0.001})}}

function inQuad(q,x,y,pad){pad=pad||0;const right=q===0||q===2,bottom=q>=2;return (right?x>AR.x-pad:x<AR.x+pad)&&(bottom?y>AR.y-pad:y<AR.y+pad)}
